# https://buf.build/docs/configuration/v2/buf-yaml/
version: v2

# https://buf.build/docs/configuration/v2/buf-yaml/#modules
modules:
  - path: bmc-grpc/proto/web

# https://buf.build/docs/lint/rules/
lint:
  use:
    - STANDARD
    - RPC_NO_CLIENT_STREAMING
    - RPC_NO_SERVER_STREAMING
  except:
    - PACKAGE_DIRECTORY_MATCH
    - PACKAGE_VERSION_SUFFIX
    - RPC_NO_SERVER_STREAMING
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE

# https://buf.build/docs/breaking/rules/#wire-and-wire_json
breaking:
  use:
    - WIRE
