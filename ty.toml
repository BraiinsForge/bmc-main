# ty type checker configuration — complements ruff linting.
# https://docs.astral.sh/ty/

[environment]
python-version = "3.12"

# Exclude sub-projects that have their own pyproject.toml with [tool.ty] config
# and their own venv — they run ty separately via their own Makefile.
[src]
exclude = [
    "widgets-wasm-examples/*/tools/",
    "widgets-wasm/iss-position/tools/",
]
