[package]
name = "bmc-widget"
version = "0.1.0"
edition = "2024"

[features]
default = []
gpu = [
    "dep:anyhow",
    "dep:drm-fourcc",
    "dep:gbm",
    "dep:glow",
    "dep:smithay",
]

[dependencies]
bmc-ipc = { workspace = true }
bmc-widget-protocol = { workspace = true }
futures = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

# GPU rendering (optional, behind "gpu" feature)
anyhow = { workspace = true, optional = true }
drm-fourcc = { workspace = true, optional = true }
gbm = { workspace = true, optional = true }
glow = { workspace = true, optional = true }
smithay = { workspace = true, default-features = false, features = ["backend_egl", "renderer_glow"], optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
