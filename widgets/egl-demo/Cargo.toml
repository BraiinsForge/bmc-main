[package]
name = "bmc-widget-egl-demo"
version = "0.1.0"
edition = "2024"

[dependencies]
# Wayland client
wayland-client = { workspace = true }
wayland-backend = { workspace = true, features = ["client_system"] }
wayland-protocols = { workspace = true, features = ["staging"] }

# OpenGL ES - use smithay's EGL wrapper for GBM-based EGL
glow = { workspace = true }
smithay = { workspace = true, default-features = false, features = ["backend_egl", "renderer_glow"] }

# Buffer management (for GBM and DMA-BUF)
gbm = { workspace = true }
drm-fourcc = { workspace = true }

# Utilities
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
anyhow = { workspace = true }

[lints]
workspace = true
