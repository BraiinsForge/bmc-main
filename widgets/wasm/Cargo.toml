[package]
name = "bmc-widget-wasm"
version = "0.1.0"
edition = "2024"

[dependencies]
# WASM runtime
bmc-wasm-protocol = { workspace = true }
bmc-wasm-runtime = { workspace = true }

# Widget SDK (gpu feature provides EGL/GBM/DMA-BUF infrastructure)
bmc-widget = { workspace = true, features = ["gpu"] }

# Wayland
wayland-backend = { workspace = true, features = ["client_system"] }
wayland-client = { workspace = true }
wayland-protocols = { workspace = true, features = ["client", "staging"] }

# BMC widget protocol (deck_widget_v1)
bmc-widget-protocol = { workspace = true }

# OpenGL ES (for blit shader in two-FBO pipeline)
glow = { workspace = true }

# Utilities
anyhow = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[lints]
workspace = true
