[package]
name = "bmc-widget-wasm"
version = "0.1.0"
edition = "2024"

[dependencies]
# WASM runtime
bmc-wasm-protocol = { workspace = true }
bmc-wasm-runtime = { workspace = true }

# Widget SDK (gpu feature provides EGL/GBM/DMA-BUF + Wayland surface client)
bmc-widget = { workspace = true, features = ["gpu"] }

# OpenGL ES (for blit shader in two-FBO pipeline)
glow = { workspace = true }

# Utilities
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[lints]
workspace = true
