[package]
name = "bmc-widget-wasm"
version = "0.1.0"
edition = "2024"

[dependencies]
# WASM runtime
bmc-wasm-protocol = { workspace = true }
bmc-wasm-runtime = { workspace = true }

# Wayland
wayland-backend = { workspace = true, features = ["client_system"] }
wayland-client = { workspace = true }
wayland-protocols = { workspace = true, features = ["client", "staging"] }

# BMC widget protocol (deck_widget_v1)
bmc-widget-protocol = { workspace = true }

# OpenGL ES
glow = { workspace = true }
smithay = { workspace = true, default-features = false, features = ["backend_egl", "renderer_glow"] }

# Buffer management
drm-fourcc = { workspace = true }
gbm = { workspace = true }

# Utilities
anyhow = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[lints]
workspace = true
