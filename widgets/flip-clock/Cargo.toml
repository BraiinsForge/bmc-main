[package]
name = "bmc-widget-flip-clock"
version = "0.1.0"
edition = "2024"

[features]
standalone = []

[dependencies]
# Widget SDK (gpu feature provides EGL/GBM/Wayland surface clients)
bmc-log = { workspace = true }
bmc-widget = { workspace = true, features = ["gpu"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

# OpenGL ES (for GL calls in render loop)
glow = { workspace = true }

# Time
chrono = { workspace = true }
chrono-tz = { workspace = true }

# Font rendering
ab_glyph = { workspace = true }

# 2D tessellation for 3D extrusion
lyon = { workspace = true }

# Utilities
anyhow = { workspace = true }
bytemuck = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
