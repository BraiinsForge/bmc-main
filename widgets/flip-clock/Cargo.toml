[package]
name = "bmc-widget-flip-clock"
version = "0.1.0"
edition = "2024"

[features]
standalone = []

[dependencies]
# Widget integration (gpu feature provides EGL/GBM/Wayland surface infrastructure)
bmc-shared-time = { workspace = true }
bmc-widget = { workspace = true, features = ["gpu"] }
bmc-widget-protocol = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }

# Wayland (for wl_buffer type in cached buffer management)
wayland-client = { workspace = true }

# OpenGL ES (for GL calls in render loop)
glow = { workspace = true }

# Time
chrono = { workspace = true }
chrono-tz = { workspace = true }

# Font rendering
ab_glyph = { workspace = true }

# 2D tessellation for 3D extrusion
lyon = { workspace = true }

# Utilities
anyhow = { workspace = true }
bytemuck = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[lints]
workspace = true
