[package]
name = "bmc-widget-flip-clock"
version = "0.1.0"
edition = "2024"

[dependencies]
# Wayland
wayland-backend = { workspace = true, features = ["client_system"] }
wayland-client = { workspace = true }
wayland-protocols = { workspace = true, features = ["staging"] }

# OpenGL ES - use smithay's EGL wrapper which handles platform selection properly
glow = { workspace = true }
smithay = { workspace = true, default-features = false, features = ["backend_egl", "renderer_glow"] }

# Buffer management
drm-fourcc = { workspace = true }
gbm = { workspace = true }

# Event loop
calloop = { workspace = true }
calloop-wayland-source = { workspace = true }

# Time
chrono = { workspace = true }
chrono-tz = { workspace = true }

# Font rendering
ab_glyph = { workspace = true }

# 2D tessellation for 3D extrusion
lyon = { workspace = true }

# Utilities
anyhow = { workspace = true }
bytemuck = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[lints]
workspace = true
