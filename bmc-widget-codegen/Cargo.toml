[package]
name = "bmc-widget-codegen"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Braiins Systems s.r.o."]
description = "Reads a widget `manifest.json` and emits a typed-accessor `manifest_params.rs` Rust module"

# The drift test reads every widget's manifest.json and its committed
# src/manifest_params.rs from the widget/example trees (separate workspaces the
# scoped filter would otherwise drop) to assert the generator is up to date.
[package.metadata.nix]
include = [
    "../widgets-wasm-examples/*/manifest.json",
    "../widgets-wasm-examples/*/src/manifest_params.rs",
    "../widgets-wasm/*/manifest.json",
    "../widgets-wasm/*/src/manifest_params.rs",
]

[[bin]]
name = "bmc-widget-codegen"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
bmc-widget-manifest = { workspace = true }
clap = { workspace = true }
heck = { workspace = true }
indoc = { workspace = true }
prettyplease = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
