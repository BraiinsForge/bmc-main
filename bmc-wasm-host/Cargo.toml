[package]
name = "bmc-wasm-host"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lints]
workspace = true

# The WAT guest fixtures `tests/widget_slot.rs` embeds from `bmc-wasm-runtime`;
# the nix source filter keeps only rust/toml/lock otherwise. Redundant while
# `bmc-wasm-runtime` is a dependency and carries the same glob, but this crate
# is the one whose tests break if that ever stops being true.
[package.metadata.nix]
include = ["../bmc-wasm-runtime/tests/fixtures/*.wat"]

[features]
default = ["overlay-alarm", "overlay-offline", "overlay-device-info", "overlay-settings-tray", "overlay-upgrade"]
overlay-alarm = ["dep:bmc-overlay-alarm"]
overlay-offline = ["dep:bmc-overlay-offline"]
overlay-device-info = ["dep:bmc-overlay-device-info"]
overlay-settings-tray = ["dep:bmc-overlay-settings-tray"]
overlay-upgrade = ["dep:bmc-overlay-upgrade"]
profiling = ["bmc-render/profiling", "bmc-wasm-runtime/profiling"]

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive"] }
femtovg = { workspace = true }
glow = { workspace = true }
libc = { workspace = true }
nix = { workspace = true }
rustix = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
wayland-client = { workspace = true }

bmc-gpu-render-lock = { workspace = true }
bmc-log = { workspace = true }
bmc-overlay-alarm = { workspace = true, optional = true }
bmc-overlay-device-info = { workspace = true, optional = true }
bmc-overlay-offline = { workspace = true, optional = true }
bmc-overlay-settings-tray = { workspace = true, optional = true }
bmc-overlay-upgrade = { workspace = true, optional = true }
bmc-render = { path = "../bmc-render" }
bmc-system-overlay = { workspace = true }
bmc-wasm-protocol = { workspace = true }
bmc-wasm-runtime = { workspace = true }
bmc-wasm-thin-protocol = { path = "../bmc-wasm-thin-protocol" }
bmc-widget = { workspace = true, features = ["gpu"] }
bmc-widget-protocol = { workspace = true }

[dev-dependencies]
mdns-sd = { workspace = true }
serial_test = "3"
tempfile = { workspace = true }
# WAT guest fixtures for `tests/widget_slot.rs`,
# same pattern as `bmc-wasm-runtime/tests/lifecycle.rs`.
wat = { workspace = true }
