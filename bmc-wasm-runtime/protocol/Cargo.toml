[package]
name = "bmc-wasm-protocol"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
bmc-shared-time = { workspace = true, optional = true }
bmc-shared-utils = { workspace = true, optional = true }
bmc-ui = { workspace = true }
chrono = { workspace = true, optional = true }
chrono-tz = { workspace = true, optional = true }
roxmltree = { workspace = true, optional = true }
rrule = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
default = []
# Shared host-side allocator for renderer and audio resource IDs.
id-pool = []
# Off by default so the SDK build path doesn't pick up serde
serde = ["dep:serde"]
# What the host computes for a guest, shared with native SDK builds.
# Off by default so the wasm SDK build path stays free of the formatting core (formato),
# the calendar (chrono-tz, rrule) and the JSON and XML readers (serde_json, roxmltree).
host = [
    "dep:bmc-shared-time",
    "dep:bmc-shared-utils",
    "dep:chrono",
    "dep:chrono-tz",
    "dep:roxmltree",
    "dep:rrule",
    "dep:serde_json",
]

[lints]
workspace = true
