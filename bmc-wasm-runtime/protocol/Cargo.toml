[package]
name = "bmc-wasm-protocol"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
bmc-widget-protocol = { workspace = true, optional = true }
palette.workspace = true
serde = { workspace = true, optional = true }

[features]
default = []
# Adds `Serialize` / `Deserialize` derives to the wasmi-wire enums
# in `bmc_wasm_protocol::system`. Off by default so the SDK build
# path doesn't pick up serde — host callers (testbed, capture)
# flip this on.
serde = ["dep:serde"]
# Adds `From`-trait bridges between this crate's shape enums and
# `bmc_widget_protocol::{DisplayShape, ViewportShape}` / `DisplayInfo`,
# so Wayland-side host code can convert without manual matches. Off by
# default so the wasm SDK build path stays free of Wayland-protocol types.
widget-protocol = ["dep:bmc-widget-protocol"]

[lints]
workspace = true
