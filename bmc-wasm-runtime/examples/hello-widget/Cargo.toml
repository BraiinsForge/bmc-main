[package]
name = "hello-widget"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
bmc-wasm-sdk = { path = "../../sdk" }

[lints.rust]
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

# Keep this crate out of the main workspace
[workspace]
