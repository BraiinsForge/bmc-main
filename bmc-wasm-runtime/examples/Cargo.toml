[package]
name = "bmc-wasm-examples"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]

[lints]
workspace = true

[workspace]
resolver = "3"
members = [
    "calendar",
    "hello-widget",
    "home-assistant",
    "media-control",
    "mesh-demo",
    "metronome",
    "params-demo",
    "pomodoro",
    "stress-test",
]

# Shared lints for all example crates
[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"

[workspace.dependencies]
prost = "0.13"

# Shared profiles — all examples are tiny WASM binaries optimized for size
[profile.dev]
opt-level = "z"
lto = true
panic = "abort"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = true

# Release optimization but keeps the wasm `name` section for profiling tools.
[profile.profiling]
inherits = "release"
strip = false
