[package]
name = "bmc-wasm-examples"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]

[lints]
workspace = true

[workspace]
resolver = "3"
members = [
    "calendar",
    "hello-widget",
    "home-assistant",
    "iss-position",
    "media-control",
    "mesh-demo",
    "metronome",
    "params-demo",
    "pomodoro",
    "spacex-launch",
    "stress-test",
]

# Shared lints for all example crates
[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"

[workspace.dependencies]
prost = "0.13"
sgp4 = { version = "2.3", default-features = false, features = ["std"] }

# Shared profiles — all examples are tiny WASM binaries optimized for size
[profile.dev]
opt-level = "z"
lto = true
panic = "abort"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = true
