[package]
name = "bmc-wasm-sdk-macros"
version = "0.1.0"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }
# Proc-macros run host-side at compile time; pulling bmc-shared-time
# (and its chrono-tz / serde deps) into the macro's compile closure
# does not affect wasm widget binaries. Used by `tz!` to validate
# IANA names against the deck's supported list (single source of truth,
# sourced from openwrt/LuCI's `zoneinfo.uc`).
bmc-shared-time = { path = "../../bmc-shared/time" }

[lints.rust]
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
