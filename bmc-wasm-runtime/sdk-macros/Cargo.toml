[package]
name = "bmc-wasm-sdk-macros"
version = "0.1.0"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
bmc-icon-compiler = { path = "../icon-compiler" }
bmc-wasm-protocol = { path = "../protocol" }
bmc-wasm-skin = { path = "../skin" }
gltf = { workspace = true, features = ["extras"] }
image = { workspace = true, default-features = false, features = ["png"] }
intel_tex_2 = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
serde_json = { workspace = true }
syn = { workspace = true }
toml.workspace = true
zip = { workspace = true, default-features = false, features = ["deflate"] }

[lints.rust]
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

# Keep this crate out of the main workspace
[workspace]

[workspace.dependencies]
gltf = "1"
image = { version = "0.25", default-features = false }
intel_tex_2 = "0.5"
proc-macro2 = "1"
quote = "1"
serde_json = "1"
syn = "2"
toml = "0.8"
zip = { version = "2", default-features = false }
