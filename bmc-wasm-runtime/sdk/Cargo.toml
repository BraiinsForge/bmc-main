[package]
name = "bmc-wasm-sdk"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["rlib"]

[features]
math-3d = ["glam"]
# Enable `profile::span`/`report` (fuel-based section profiling).
# Off by default so production widgets carry no profiling code.
profiling = []

[dependencies]
bmc-led = { path = "../../bmc-led", default-features = false }
bmc-render-macros = { path = "../../bmc-render/macros" }
bmc-render-skin = { path = "../../bmc-render/skin" }
bmc-wasm-protocol = { path = "../protocol" }
bmc-wasm-sdk-macros = { path = "../sdk-macros" }
glam = { workspace = true, default-features = false, features = ["libm"], optional = true }
percent-encoding.workspace = true
ufmt = { workspace = true }
unit-prefix = { workspace = true }

# Native-only: the gallery (and any non-wasm build) formats
# through the shared core instead of the host FFI.
# Kept off the wasm target so `formato` never lands in a widget binary
# — on device, formatting still goes through the host.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bmc-shared-utils = { workspace = true }
bmc-wasm-protocol = { path = "../protocol", features = ["domain"] }

[lints]
workspace = true
