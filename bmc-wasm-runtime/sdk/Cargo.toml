[package]
name = "bmc-wasm-sdk"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["rlib"]

[features]
math-3d = ["glam", "bmc-ui/math-3d"]
# Enable `profile::span`/`report` (fuel-based section profiling).
# Off by default so production widgets carry no profiling code.
profiling = []
# `system::set_current` on wasm, through the test host's import.
# For dev-dependencies only: no shipped host provides it, so a widget calling it fails to load.
test-support = []

[dependencies]
bmc-led = { path = "../../bmc-led", default-features = false }
bmc-render-macros = { path = "../../bmc-render/macros" }
bmc-ui = { path = "../../bmc-render/ui" }
bmc-wasm-protocol = { path = "../protocol" }
bmc-wasm-sdk-macros = { path = "../sdk-macros" }
bmc-wasm-test-abi = { path = "../../bmc-wasm-test-runner/abi" }
glam = { workspace = true, default-features = false, features = ["libm"], optional = true }
percent-encoding.workspace = true
ufmt = { workspace = true }
unit-prefix = { workspace = true }

# Native-only: the gallery (and any non-wasm build) formats numbers
# and reads the calendar through the shared core instead of the host FFI.
# Kept off the wasm target so `formato` and `chrono-tz` never land
# in a widget binary — on device, both still go through the host.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bmc-shared-utils = { workspace = true }
bmc-wasm-protocol = { path = "../protocol", features = ["host"] }
tracing.workspace = true

[lints]
workspace = true
