[package]
name = "bmc-wasm-sdk"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["rlib"]

[features]
## Enable 3D math utilities (glam re-export, Orientation↔Quat conversion).
## Adds ~6KB to WASM binary. Only needed for widgets doing 3D math beyond basic Orientation use.
math-3d = ["glam"]
## Enable `profile::span`/`report` (fuel-based section profiling). Off by
## default so production widgets carry no profiling code.
profiling = []

[dependencies]
bmc-led = { path = "../../bmc-led", default-features = false }
bmc-render-macros = { path = "../../bmc-render/macros" }
bmc-render-skin = { path = "../../bmc-render/skin" }
bmc-wasm-protocol = { path = "../protocol" }
bmc-wasm-sdk-macros = { path = "../sdk-macros" }
glam = { workspace = true, default-features = false, features = ["libm"], optional = true }
ufmt = { workspace = true }

[lints]
workspace = true
