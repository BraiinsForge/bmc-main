[package]
name = "bmc-svg-compiler"
version = "0.1.0"
edition = "2024"

# The forbid-filters test scans every shipping widget SVG under widgets-wasm
# (a separate workspace the scoped filter would otherwise drop).
[package.metadata.nix]
include = ["../../widgets-wasm/**/*.svg"]

[dependencies]
usvg.workspace = true

[dev-dependencies]
roxmltree.workspace = true

[lints]
workspace = true
