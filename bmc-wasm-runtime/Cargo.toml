[package]
name = "bmc-wasm-runtime"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

# The capture report askama template, the WAT guest fixtures the test suites
# embed, and the toolbar icons the testbed `include_bytes!`s; the nix source
# filter keeps only rust/toml/lock otherwise.
[package.metadata.nix]
include = [
    "templates/**",
    "tests/fixtures/*.wat",
    "src/bin/testbed/assets/icons/*.svg",
]

[dependencies]
anyhow.workspace = true
bmc-led.workspace = true
bmc-platform.workspace = true
bmc-render = { path = "../bmc-render" }
bmc-shared-time = { path = "../bmc-shared/time" }
bmc-shared-utils = { workspace = true }
bmc-wasm-assets = { path = "../bmc-wasm-assets", optional = true }
bmc-wasm-protocol = { path = "protocol", features = ["domain", "id-pool", "serde", "widget-protocol"] }
bmc-widget-manifest.workspace = true
bmc-widget-protocol.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
iana-time-zone.workspace = true
ii-stopwatch.workspace = true
indoc.workspace = true
tracing.workspace = true

# WASM runtime
wasmi.workspace = true

# Rendering
femtovg.workspace = true
glow.workspace = true
image.workspace = true
sha2.workspace = true
wasmparser.workspace = true

# Layout
taffy.workspace = true

# Network + JSON/XML (for host-side fetch and parsing)
mdns-sd.workspace = true
memmap2.workspace = true
roxmltree.workspace = true
rrule.workspace = true
rustix.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tungstenite.workspace = true
ureq.workspace = true
url.workspace = true
webpki-roots.workspace = true

# Audio playback
rodio = { workspace = true, optional = true, features = ["mp3", "vorbis", "wav"] }

# Host binaries (GL windowing)
glutin = { workspace = true, optional = true }
glutin-winit = { workspace = true, optional = true }
raw-window-handle = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
winit = { workspace = true, optional = true }

# Testbed only
binpack2d = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
egui_autocomplete = { workspace = true, optional = true }
egui_glow = { workspace = true, optional = true }
egui_sgr = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
resvg = { workspace = true, optional = true }

# Fixtures (shared between capture and testbed)
flate2 = { workspace = true, optional = true }

# Capture only — ANGLE EGL on macOS (loaded at runtime via dlopen)
askama = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
console = { workspace = true, optional = true }
khronos-egl = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
owo-colors = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
sevenz-rust2 = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
toml_edit = { workspace = true, optional = true }
wasm-encoder = { workspace = true, optional = true }

[features]
default = []
testing = []
perf-overlay = []
profiling = ["ii-stopwatch/enabled", "bmc-render/profiling"]
audio = ["rodio"]
host = ["glutin", "glutin-winit", "raw-window-handle", "tracing-subscriber", "winit"]
fixtures = ["host", "base64", "bmc-wasm-assets", "flate2", "owo-colors", "tempfile", "toml", "toml_edit"]
testbed = ["host", "perf-overlay", "notify", "fixtures", "audio", "binpack2d", "egui", "egui_autocomplete", "egui_glow", "egui_sgr", "resvg", "clap", "bmc-led/apa102_spi", "bmc-wasm-protocol/egui"]
capture = ["host", "askama", "base64", "clap", "console", "khronos-egl", "libc", "fixtures", "rayon", "sevenz-rust2", "tempfile", "wasm-encoder"]

[[bin]]
name = "testbed"
path = "src/bin/testbed/main.rs"
required-features = ["testbed"]

[[bin]]
name = "capture"
path = "src/bin/capture/main.rs"
required-features = ["capture"]

[dev-dependencies]
bmc-wasm-assets = { path = "../bmc-wasm-assets" }
# Pull the SDK parser in for the host-encoder → SDK-parser round-trip test in
# `runtime::imports::params::tests`. The wasm32-gated externs aren't compiled
# on native; only the parser (`Params::from_bytes`, `entries()`) is exercised.
bmc-wasm-sdk = { path = "sdk" }
# Hand-rolled WAT fixtures for `tests/lifecycle.rs` — avoids a cross-target
# build dependency on the example widgets.
wat.workspace = true
# Headless EGL stack for `tests/lifecycle.rs`. The `capture` binary already
# uses this on Linux; the test harness reuses the same setup so tests can
# construct a real `WasmWidgetRuntime` under the `ci` build profile
# (Mesa + llvmpipe + surfaceless EGL).
glutin.workspace = true
# Temp dirs for the image-cache round-trip tests.
tempfile.workspace = true
# Integration tests are separate crates and cannot reach the normal
# dependencies, so `tests/credential_egress.rs` needs these listed again
# to seed `RuntimeConfig` and to name credential types by their enum.
bmc-widget-manifest.workspace = true
bmc-widget-protocol.workspace = true
# `tests/credential_egress.rs` reads the fetch logs back to prove they carry
# the placeholder form. The lines are `debug!`, so capture needs a subscriber,
# and the crate's own is optional behind `host`, which a test cannot turn on.
tracing-subscriber.workspace = true

[lints]
workspace = true
