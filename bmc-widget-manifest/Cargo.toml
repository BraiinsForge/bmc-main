[package]
name = "bmc-widget-manifest"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Braiins Systems s.r.o."]
description = "Widget manifest types — the on-disk schema for `manifest.json` shared between the compositor, the wasm host runtime, and tooling"

# The committed JSON schema embedded by the schema/fixture tests, plus every
# shipped manifest.json the tests load at runtime from the widget/example trees
# (each lives in a separate workspace the scoped filter would otherwise drop).
[package.metadata.nix]
include = [
    "manifest.schema.json",
    "../widgets/*/manifest.json",
    "../widgets-wasm-examples/*/manifest.json",
    "../widgets-wasm/*/manifest.json",
]

[dependencies]
bmc-field-schema.workspace = true
indexmap.workspace = true
schemars = { workspace = true, features = ["indexmap2", "semver1"] }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
jsonschema.workspace = true

[lints]
workspace = true
