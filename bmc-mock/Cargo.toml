[package]
name = "bmc-mock"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Braiins <braiins@braiins.com>"]

# Mock widget preview images embedded via include_bytes! from the top-level
# assets tree. The nix source filter keeps only rust/toml/lock unless a crate
# opts extra files here.
[package.metadata.nix]
include = ["../assets/mock-widget-previews/*"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum-extra.workspace = true
base64.workspace = true
bmc.workspace = true
bmc-button.workspace = true
bmc-led = { workspace = true, features = ["driver"] }
bmc-net.workspace = true
bmc-net-types.workspace = true
bmc-nix.workspace = true
bmc-platform = { workspace = true, features = ["backlight"] }
bmc-shared-time.workspace = true
bmc-shared-utils.workspace = true
bmc-support.workspace = true
bmc-upgrade.workspace = true
bmc-widget-manifest.workspace = true
chrono.workspace = true
clap.workspace = true
dirs.workspace = true
futures = { workspace = true }
rand = { workspace = true, features = ["thread_rng"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }
walkdir.workspace = true
zip.workspace = true

[dev-dependencies]
bmc-grpc = { workspace = true, features = ["client"] }
libc.workspace = true
sha2.workspace = true
tempfile.workspace = true
tonic.workspace = true

[lints]
workspace = true
