[package]
name = "halving-countdown"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

# Ship the manifest icon — nix's source filter drops non-rust/toml/lock otherwise.
[package.metadata.nix]
include = ["assets/**"]

# `lib` (native rlib) beside the wasm `cdylib`, so the gallery
# and the tests can render the layouts off-device.
[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
bmc-wasm-sdk = { path = "../../bmc-wasm-runtime/sdk" }
mining = { path = "../lib/mining" }
units = { path = "../lib/units" }

[lints]
workspace = true
