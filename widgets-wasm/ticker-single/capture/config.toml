# Capture configuration for visual regression testing.

# Settle a few frames after the fetch stub fires so the widget leaves Loading,
# parses the candles, and draws the chart before the first capture.
settle_delay = 5

# A fixture carries no geometry, so one recording serves every viewport.
[fixtures.bmc100-full]
path = "fixtures/common.jsonl.gz"
target = "bmc100:full"

[fixtures.bmc100-large]
path = "fixtures/common.jsonl.gz"
target = "bmc100:large"

[fixtures.bmc100-medium]
path = "fixtures/common.jsonl.gz"
target = "bmc100:medium"

[fixtures.bmc100-small]
path = "fixtures/common.jsonl.gz"
target = "bmc100:small"

[fixtures.bmm101-full]
path = "fixtures/common.jsonl.gz"
target = "bmm101:full"
