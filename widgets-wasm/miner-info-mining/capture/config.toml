# Capture configuration for visual regression testing.

# Settle for a few frames after the chained fetch stubs fire so the widget
# has parsed every miner response before the first capture.
settle_delay = 5

[fixtures.bmm100-full]
path = "fixtures/bmm100-full.jsonl.gz"
targets = ["bmm100:full"]

[fixtures.bfm100-full]
path = "fixtures/bfm100-full.jsonl.gz"
targets = ["bfm100:full"]
