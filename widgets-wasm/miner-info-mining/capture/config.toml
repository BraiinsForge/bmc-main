# Capture configuration for visual regression testing.

# Settle for a few frames before each capture, so a frame shows
# settled data and a finished transition rather than a mid-load state.
settle_delay = 5

# The `-parity` pair is the pixel proof that splitting mining-info
# changed no rendering, so it must be replayed as-is.
# Nothing enforces that: the dialog will offer to re-record either one.
[fixtures.bmm100-full-parity]
path = "fixtures/bmm100-full-parity.jsonl.gz"
targets = ["bmm100:full"]

[fixtures.bfm100-full-parity]
path = "fixtures/bfm100-full-parity.jsonl.gz"
targets = ["bfm100:full"]

[fixtures.bmm101-full-healthy]
path = "fixtures/bmm101-full-healthy.jsonl.gz"
targets = ["bmm101:full"]

[fixtures.bmm100-full-healthy]
path = "fixtures/bmm100-full-healthy.jsonl.gz"
targets = ["bmm100:full"]

[fixtures.bfm100-full-gauge]
path = "fixtures/bfm100-full-gauge.jsonl.gz"
targets = ["bfm100:full"]

[fixtures.bfm100-full-no-chip]
path = "fixtures/bfm100-full-no-chip.jsonl.gz"
targets = ["bfm100:full"]

[fixtures.bmm101-full-degraded]
path = "fixtures/bmm101-full-degraded.jsonl.gz"
targets = ["bmm101:full"]

[fixtures.bfm100-full-degraded]
path = "fixtures/bfm100-full-degraded.jsonl.gz"
targets = ["bfm100:full"]

[fixtures.bmc100-small-healthy]
path = "fixtures/bmc100-small-healthy.jsonl.gz"
targets = ["bmc100:small"]
