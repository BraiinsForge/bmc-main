# Capture configuration for visual regression testing.

# Settle for a few frames after the chained fetch stubs fire so the widget
# has parsed every miner response before the first capture.
settle_delay = 5

[fixtures.bmm100-full]
path = "fixtures/bmm100-full.jsonl.gz"
targets = ["bmm100:full"]

[fixtures.bfm100-full]
path = "fixtures/bfm100-full.jsonl.gz"
targets = ["bfm100:full"]

[fixtures.bmm101-full-healthy]
path = "fixtures/bmm101-full-healthy.jsonl.gz"
targets = ["bmm101:full"]

[fixtures.bmm100-full-healthy]
path = "fixtures/bmm100-full-healthy.jsonl.gz"
targets = ["bmm100:full"]

[fixtures.bfm100-full-gauge]
path = "fixtures/bfm100-full-gauge.jsonl.gz"
targets = ["bfm100:full"]

[fixtures.bfm100-full-no-chip]
path = "fixtures/bfm100-full-no-chip.jsonl.gz"
targets = ["bfm100:full"]

[fixtures.bmm101-full-degraded]
path = "fixtures/bmm101-full-degraded.jsonl.gz"
targets = ["bmm101:full"]

[fixtures.bfm100-full-degraded]
path = "fixtures/bfm100-full-degraded.jsonl.gz"
targets = ["bfm100:full"]

[fixtures.bmc100-small-healthy]
path = "fixtures/bmc100-small-healthy.jsonl.gz"
targets = ["bmc100:small"]
