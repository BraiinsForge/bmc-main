[project]
name = "iss-texture-tools"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cartopy>=0.23",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pillow>=10.0",
    "tyro>=0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
# The section itself stops the rootdir search here, so pytest never picks up
# the repo-root coverage options, which target bmc-tui and are absent here.
testpaths = ["."]

[tool.uv]
# Scripts run via: uv run texture_render.py

[tool.basedpyright]
typeCheckingMode = "all"
# This project's own environment, the one `just lint` syncs.
venvPath = "."
venv = ".venv"
# cartopy ships neither `py.typed` nor a stub package.
reportMissingTypeStubs = false
