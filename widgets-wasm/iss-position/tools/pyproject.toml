[project]
name = "iss-texture-tools"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cartopy>=0.23",
    "matplotlib>=3.9",
]

[tool.uv]
# Scripts run via: uv run texture_render.py

[tool.ty.rules]
# cartopy GeoAxes methods (set_global, add_feature, spines) are not visible
# to ty because add_axes returns generic Axes, not GeoAxes.
unresolved-attribute = "ignore"
