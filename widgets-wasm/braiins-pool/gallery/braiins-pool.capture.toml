# The widget's own fixtures are recorded sessions and carry no 480x320 take —
# their three URL sets differ, so none replays at another viewport. These
# scenes render the same screens straight from view fixtures instead, which is
# what covers BMM101 at all.

size = "1280x560"
sheet = "sheet.png"
report = "capture.json"
settle = true

[[shot]]
name = "overview-bmm101"
scene = "bmc_gallery::pool::Overview"
frames = 8

[shot.knobs]
Size = "BMM"

