# Every board at 480x320. The recorded sessions reach two season scenarios
# there; these reach all of them, plus the empty and unavailable states no
# recording ever captured at any geometry.
#
# The `*-widest` and `*-ruler` scenes are deliberately absent: they stress
# the longest strings a layout survives, which is a developer's question.
#
# The four Deck fullscreen shots at the end are the same scenes from the same
# fixtures, so a screen can be compared across sizes without crossing sources.

size = "640x480"
sheet = "sheet.png"
report = "capture.json"
settle = true

[[shot]]
name = "standings-bmm101"
scene = "bmc_gallery::f1::Standings"
frames = 8

[shot.knobs]
