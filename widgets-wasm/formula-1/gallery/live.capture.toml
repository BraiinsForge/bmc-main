# The live timing boards at every design size, one frame per shot.
# See `standings.capture.toml` for what `size` and `frames` are doing.
#
# The idle shots stack all three boards, so they stay at the two extremes
# rather than every size — the point is the waiting message, not the frame.
size = "1280x560"
sheet = "sheet.png"
report = "capture.json"
settle = true

[[shot]]
name = "live-race-full"
scene = "bmc_gallery::f1::Live Race"
frames = 24

[shot.knobs]
Size = "Fullscreen"

[[shot]]
name = "live-race-large"
scene = "bmc_gallery::f1::Live Race"
frames = 24

[shot.knobs]
Size = "Large"

[[shot]]
name = "live-race-medium"
scene = "bmc_gallery::f1::Live Race"
frames = 24

[shot.knobs]
Size = "Medium"

[[shot]]
name = "live-race-small"
scene = "bmc_gallery::f1::Live Race"
frames = 24

[shot.knobs]
Size = "Small"

