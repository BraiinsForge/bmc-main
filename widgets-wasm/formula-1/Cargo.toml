[package]
name = "formula-1"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

# Files embedded at compile time.
# The nix source filter keeps only rust/toml/lock unless opted in here,
# and a missing one fails the gallery build rather than this crate's.
[package.metadata.nix]
include = ["assets/**", "gallery/artwork/**"]

[lib]
# `lib` (native rlib) in addition to the wasm `cdylib` so the gallery can
# depend on this crate and render its view fns natively.
crate-type = ["cdylib", "lib"]

[dependencies]
bmc-wasm-sdk = { path = "../../bmc-wasm-runtime/sdk" }

[lints]
workspace = true
