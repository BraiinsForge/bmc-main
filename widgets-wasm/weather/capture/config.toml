# Capture configuration for visual regression testing.

# Settle for a few frames after the fetch stub fires so the widget leaves the
# Loading state and parses the forecast before the first capture.
settle_delay = 5

[fixtures.bmc100-small]
path = "fixtures/bmc100-small.jsonl.gz"
targets = ["bmc100:small"]

[fixtures.bmc100-medium]
path = "fixtures/bmc100-medium.jsonl.gz"
targets = ["bmc100:medium"]

[fixtures.bmc100-large]
path = "fixtures/bmc100-large.jsonl.gz"
targets = ["bmc100:large"]

[fixtures.bmc100-full]
path = "fixtures/bmc100-full.jsonl.gz"
targets = ["bmc100:full"]

[fixtures.bmm101-full]
path = "fixtures/bmm101-full.jsonl.gz"
targets = ["bmm101:full"]
