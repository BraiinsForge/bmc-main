# The recorded forecast at every design size and on BMM100.
# Each state over the Large and BMM101 layouts, loading at every size.
# The widest temperatures and the longest location everywhere.
# The settings that reshape a value.

size = "1280x560"
sheet = "sheet.png"
report = "capture.json"
settle = true

[[shot]]
name = "healthy-full"
scene = "bmc_gallery::weather::Healthy"
frames = 24

[shot.knobs]
Size = "Fullscreen"

[[shot]]
name = "healthy-large"
scene = "bmc_gallery::weather::Healthy"
frames = 24

[shot.knobs]
Size = "Large"

[[shot]]
name = "healthy-medium"
scene = "bmc_gallery::weather::Healthy"
frames = 24

[shot.knobs]
Size = "Medium"

[[shot]]
name = "healthy-small"
scene = "bmc_gallery::weather::Healthy"
frames = 24

[shot.knobs]
Size = "Small"

[[shot]]
name = "healthy-bmm101"
scene = "bmc_gallery::weather::Healthy"
frames = 24

[shot.knobs]
Size = "BMM101"

[[shot]]
name = "healthy-bmm100"
scene = "bmc_gallery::weather::BMM100"
frames = 24

# A 12-hour clock, Fahrenheit and imperial wind, all of which reach the full layout.
[[shot]]
name = "healthy-full-12h-imperial"
scene = "bmc_gallery::weather::Healthy"
frames = 24

[shot.knobs]
Size = "Fullscreen"
Units = "Imperial"
Clock = "12-hour"
Temperature = "Fahrenheit"

[[shot]]
name = "healthy-bmm101-12h-imperial"
scene = "bmc_gallery::weather::Healthy"
frames = 24

[shot.knobs]
Size = "BMM101"
Units = "Imperial"
Clock = "12-hour"
Temperature = "Fahrenheit"

# Times follow the system zone instead of Prague's.
[[shot]]
name = "healthy-large-system-zone"
scene = "bmc_gallery::weather::Healthy"
frames = 24

[shot.knobs]
