# Every face at every design size, the readouts and system settings that
# change a face, and the two panels without a bucket of their own.
# 48 frames covers the hands' 500 ms easing.

size = "1280x560"
sheet = "sheet.png"
report = "capture.json"
settle = true

[[shot]]
name = "digital-full"
scene = "bmc_gallery::clock::Digital"
frames = 48

[shot.knobs]
Size = "Fullscreen"

