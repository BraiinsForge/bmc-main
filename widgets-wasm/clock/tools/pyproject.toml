# Makes the dial generator a member of the uv workspace,
# so what it imports is declared here.
# Metadata only, as `scripts/pyproject.toml` explains.

[project]
name = "bmc-clock-tools"
version = "0.0.0"
description = "Clock widget generators that are run as files, not imported"
license = "GPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = [
    "tyro>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
