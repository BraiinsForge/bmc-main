# The BMM101 faces: Mining with the miner reporting and with it gone,
# Geek with and without the network, Info Overload across
# the three price moves.
#
# `capture.json` lands beside the shots for a loop to read;
# where they land is the recipe's to say.
#
# `just gallery::capture` passes an `--out`
# under the repo's scratch dir.
size = "1280x720"
sheet = "sheet.png"
report = "capture.json"
settle = true

[[shot]]
name = "mining-bmm101-reporting"
scene = "bmc_gallery::miner_info::Bmm101"
frames = 4

[shot.knobs]
Data = "Populated"
Face = "Mining"

# Temperature and MCR each need a pair of readings; a miner reporting
# only half of each shows their placeholders among live rows.
[[shot]]
name = "mining-bmm101-without-boards"
scene = "bmc_gallery::miner_info::Bmm101"
frames = 4

[shot.knobs]
Data = "Without board readings"
Face = "Mining"

[[shot]]
name = "mining-bmm101-unavailable"
scene = "bmc_gallery::miner_info::Bmm101"
frames = 4

[shot.knobs]
Data = "Unavailable"
Face = "Mining"

[[shot]]
name = "geek-bmm101-network-reporting"
scene = "bmc_gallery::miner_info::Bmm101"
frames = 4

[shot.knobs]
Data = "Populated"
Face = "Geek"

# The same list at the small panel's type size, on the tightest screen it serves.
[[shot]]
name = "geek-small-network-reporting"
scene = "bmc_gallery::miner_info::Rectangular"
frames = 4

[shot.knobs]
Data = "Populated"
Face = "Geek"
Viewport = "BMC100 slot"

[[shot]]
name = "geek-bmm101-network-down"
scene = "bmc_gallery::miner_info::Bmm101"
frames = 4

[shot.knobs]
Data = "Unavailable"
Face = "Geek"

[[shot]]
name = "overload-bmm101-price-up"
scene = "bmc_gallery::miner_info::Bmm101"
frames = 4

[shot.knobs]
Face = "Info Overload"
Price = "Up"

[[shot]]
name = "overload-bmm101-price-down"
scene = "bmc_gallery::miner_info::Bmm101"
frames = 4

[shot.knobs]
Face = "Info Overload"
Price = "Down"

[[shot]]
name = "overload-bmm101-no-history"
scene = "bmc_gallery::miner_info::Bmm101"
frames = 4

[shot.knobs]
Face = "Info Overload"
Price = "No history"
