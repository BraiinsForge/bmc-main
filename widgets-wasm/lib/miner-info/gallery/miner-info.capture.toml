# The BMM101 faces: Mining with and without board readings,
# Geek with and without the network, Info Overload across
# the three price moves.
#
# `capture.json` lands beside the shots for a loop to read;
# where they land is the recipe's to say.
#
# `just gallery::capture` passes an `--out`
# under the repo's scratch dir.
size = "1280x720"
sheet = "sheet.png"
report = "capture.json"
settle = true

# Temperature pairs a board reading with a chip one, and the mining-mode ratio
# pairs a real rate with a nominal one. A miner reporting neither half loses
# both rows outright, which is what the two shots straddle.
[[shot]]
name = "mining-bmm101-all-readings"
scene = "bmc_gallery::miner_info::Bmm101"
frames = 4

[shot.knobs]
Data = "Populated"
Face = "Mining"

[[shot]]
name = "mining-bmm101-without-board-readings"
scene = "bmc_gallery::miner_info::Bmm101"
frames = 4

[shot.knobs]
Data = "Without board readings"
Face = "Mining"

[[shot]]
name = "geek-bmm101-network-reporting"
scene = "bmc_gallery::miner_info::Bmm101"
frames = 4

[shot.knobs]
Data = "Populated"
Face = "Geek"

[[shot]]
name = "geek-bmm101-network-down"
scene = "bmc_gallery::miner_info::Bmm101"
frames = 4

[shot.knobs]
Data = "Unavailable"
Face = "Geek"

[[shot]]
name = "overload-bmm101-price-up"
scene = "bmc_gallery::miner_info::Bmm101"
frames = 4

[shot.knobs]
Face = "Info Overload"
Price = "Up"

[[shot]]
name = "overload-bmm101-price-down"
scene = "bmc_gallery::miner_info::Bmm101"
frames = 4

[shot.knobs]
Face = "Info Overload"
Price = "Down"

[[shot]]
name = "overload-bmm101-no-history"
scene = "bmc_gallery::miner_info::Bmm101"
frames = 4

[shot.knobs]
Face = "Info Overload"
Price = "No history"
