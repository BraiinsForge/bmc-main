# Nextest settings for the widget workspace; the root's `.config/nextest.toml`
# does not reach it, and a profile named in `NEXTEST_PROFILE` has to exist here.

experimental = ["setup-scripts"]

# Builds the runner once per run, not once per wasm32 test.
[scripts.setup.wasm-test-runner]
command = "../scripts/wasm_test_runner.sh --nextest-setup"

[[profile.default.scripts]]
platform = 'cfg(target_arch = "wasm32")'
setup = "wasm-test-runner"

# Fuel stops a looping guest, but not a host call that never returns.
[[profile.default.overrides]]
platform = 'cfg(target_arch = "wasm32")'
slow-timeout = { period = "60s", terminate-after = 1 }

# For a coding agent: the built-in reporter goes silent, and `scripts/nextest_report.py`
# reads the `libtest-json-plus` stream instead — a line per binary naming every test,
# failures in full. `common.justfile` selects it whenever an agent's environment is detected.
[profile.agent]
status-level = "none"
final-status-level = "none"
