[package]
name = "bmc-wasm-widgets"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]

[lints]
workspace = true

[workspace]
resolver = "3"
members = [
    "blockheight",
    "braiins-pool",
    "clock",
    "fleet-management",
    "halving-countdown",
    "image",
    "iss-position",
    "lib/mining",
    "lib/units",
    "mining-clock",
    "mining-info",
    "nameday",
    "random-facts",
    "spacex-launch",
    "weather",
]

# Shared lints for all production widget crates
[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"

[workspace.dependencies]
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
# Serde-free: bincode 2's native `Encode`/`Decode` derive keeps `serde` out of the wasm graph
bincode = { version = "2.0.0", default-features = false, features = ["alloc", "derive"] }
form_urlencoded = { version = "1.2", default-features = false, features = ["alloc"] }
sgp4 = { version = "2.4", default-features = false, features = ["std"] }

# Shared profiles — all widgets are tiny WASM binaries optimized for size
[profile.dev]
opt-level = "z"
lto = true
panic = "abort"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = true

# Release optimization but keeps the wasm `name` section for profiling tools.
[profile.profiling]
inherits = "release"
strip = false
