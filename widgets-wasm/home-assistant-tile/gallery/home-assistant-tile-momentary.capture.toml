# A button's, a scene's or a script's tile: its one action, under each tap and hold setting.

size = "720x352"
sheet = "sheet.png"
report = "capture.json"
settle = true

[[shot]]
name = "press"
scene = "bmc_gallery::home_assistant_tile_momentary::Momentary"
frames = 4

[[shot]]
name = "press-scene"
scene = "bmc_gallery::home_assistant_tile_momentary::Momentary"
frames = 4

[shot.knobs]
Kind = "Scene"

[[shot]]
name = "press-script-running"
scene = "bmc_gallery::home_assistant_tile_momentary::Momentary"
frames = 4

[shot.knobs]
Kind = "Script"
Readiness = "Running"

[[shot]]
name = "press-script-stopping"
scene = "bmc_gallery::home_assistant_tile_momentary::Momentary"
frames = 4

[shot.knobs]
Kind = "Script"
Readiness = "Running"
"Press on its way" = true

[[shot]]
name = "press-unavailable"
scene = "bmc_gallery::home_assistant_tile_momentary::Momentary"
frames = 4

[shot.knobs]
Readiness = "Unavailable"

[[shot]]
name = "press-hold-only"
