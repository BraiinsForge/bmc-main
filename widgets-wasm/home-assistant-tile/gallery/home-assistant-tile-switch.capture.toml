# A switch's tile, and those of the other entities that are on or off, at each size.

size = "1400x600"
sheet = "sheet.png"
report = "capture.json"
settle = true

[[shot]]
name = "switch-on"
scene = "bmc_gallery::home_assistant_tile_switch::Switch"
frames = 4

[[shot]]
name = "switch-off"
scene = "bmc_gallery::home_assistant_tile_switch::Switch"
frames = 4

[shot.knobs]
Position = "Off"

