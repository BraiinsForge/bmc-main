# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = true

# ── Advisories ────────────────────────────────────────────────────────
[advisories]
unmaintained = "workspace"

# ── Duplicate crate bans ─────────────────────────────────────────────
[bans]
multiple-versions = "deny"
wildcards = "allow"
highlight = "all"

# Transitive duplicates we can't resolve (ecosystem version migrations).
# Revisit periodically — remove entries once the ecosystem catches up.
skip = [
    # reqwest 0.11 → hyper 0.14 ecosystem (remove after upgrading to reqwest 0.12+)
    { crate = "base64@0.21" },
    { crate = "h2@0.3" },
    { crate = "http@0.2" },
    { crate = "http-body@0.4" },
    { crate = "hyper@0.14" },
    { crate = "mio@0.8" },
    { crate = "rustls@0.21" },
    { crate = "rustls-webpki@0.101" },
    { crate = "socket2@0.4" },
    { crate = "socket2@0.5" },
    { crate = "sync_wrapper@0.1" },
    { crate = "tower@0.4" },
    { crate = "webpki-roots@0.25" },

    # ureq 3.4 requires base64 0.23.
    # Remove after the workspace, tonic, tonic-web, and usvg leave 0.22.
    { crate = "base64@0.23" },

    # rand 0.8 → 0.9 migration (see BDK-465).
    { crate = "getrandom@0.2" },
    { crate = "getrandom@0.3" },
    { crate = "rand@0.8" },
    { crate = "rand_chacha@0.3" },
    { crate = "rand_core@0.6" },

    # wasmi 1.0.9 uses wasmparser 0.228 while capture instrumentation matches
    # wasm-encoder 0.244. Remove after upgrading wasmi.
    { crate = "wasmparser@0.228" },

    # Font/text ecosystem (cosmic-text pulls swash+harfrust with different versions)
    { crate = "font-types@0.10" },
    { crate = "read-fonts@0.35" },
    { crate = "skrifa@0.37" },
    { crate = "roxmltree@0.20" },

    # bmc-svg-compiler pins usvg 0.45 while resvg pulls the 0.47 line
    { crate = "usvg@0.45" },
    { crate = "svgtypes@0.15" },
    { crate = "tiny-skia@0.11" },
    { crate = "tiny-skia-path@0.11" },
    { crate = "imagesize@0.13" },

    # gltf (sdk-macros) uses base64 0.13
    { crate = "base64@0.13" },

    # Wayland/Smithay ecosystem splits
    { crate = "calloop@0.13" },
    { crate = "gbm@0.17" },
    { crate = "gbm-sys@0.3" },

    # Apple/ObjC framework splits (winit vs softbuffer vs egui)
    { crate = "block2@0.5" },
    { crate = "core-foundation@0.9" },
    { crate = "objc2@0.5" },
    { crate = "objc2-app-kit@0.2" },
    { crate = "objc2-foundation@0.2" },
    { crate = "objc2-ui-kit@0.2" },

    # eframe/egui ecosystem splits
    { crate = "glow@0.16" },
    { crate = "jni@0.21" },
    { crate = "jni-sys@0.3" },
    { crate = "kurbo@0.11" },

    # Widespread ecosystem splits
    { crate = "bitflags@1" },

    { crate = "hashbrown@0.14" },
    { crate = "itertools@0.12" },
    { crate = "linux-raw-sys@0.4" },
    { crate = "linux-raw-sys@0.6" },
    { crate = "memoffset@0.6" },
    { crate = "nix@0.23" },
    { crate = "nix@0.26" },
    { crate = "nix@0.29" },
    { crate = "redox_syscall@0.4" },
    { crate = "regex-automata@0.1" },
    { crate = "regex-syntax@0.6" },
    { crate = "rustix@0.38" },
    { crate = "smol_str@0.2" },
    { crate = "thiserror@1" },
    { crate = "thiserror-impl@1" },
    { crate = "hermit-abi@0.3" },
    { crate = "hermit-abi@0.4" },
    { crate = "r-efi@5" },
    { crate = "winapi@0.3" },

    # Audio ecosystem (cpal/rodio pulls older ndk via oboe)
    { crate = "ndk@0.8" },
    { crate = "ndk-sys@0.5" },
]

# Platform crate trees with massive version fragmentation — skip subtrees.
skip-tree = [
    { crate = "windows@0.54" },
    { crate = "windows@0.61" },
    { crate = "windows-sys@0.45" },
    { crate = "windows-sys@0.48" },
    { crate = "windows-sys@0.52" },
    { crate = "windows-sys@0.59" },
    { crate = "windows-sys@0.60" },
]

# ── Licenses ──────────────────────────────────────────────────────────
# Workspace crates are GPL-3.0-or-later. Third-party license auditing is
# not checked in CI — enable if GPL-compatibility auditing is needed.

# ── Sources ───────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
# Every git source in every lockfile here is listed below, so an unlisted one
# is a new dependency nobody vetted rather than a gap in this list.
unknown-git = "deny"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
]
allow-git = [
    # Pinned upstream forks used in the workspace:
    # - egui_autocomplete: pulled by bmc-widget-wasm via bmc-wasm-runtime
    # - smithay: pulled by bmc-widget (compositor) and bmc-openwrt
    # - tokio-cron-scheduler: pulled by bmc-scheduler
    # - rs-gallery: the gallery framework, in bmc-gallery's own lockfile only
    # - femtovg: carries the Gray8 glTexSubImage2D format fix; see Cargo.toml
    "https://github.com/BraiinsForge/femtovg.git",
    "https://github.com/BraiinsForge/tokio-cron-scheduler.git",
    "https://github.com/kubijo/rs-gallery.git",
    "https://github.com/yvind/egui_autocomplete.git",
    "https://github.com/Smithay/smithay.git",
]
