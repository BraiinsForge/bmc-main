# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = true

# ── Advisories ────────────────────────────────────────────────────────
[advisories]
unmaintained = "workspace"

# ── Duplicate crate bans ─────────────────────────────────────────────
[bans]
multiple-versions = "deny"
wildcards = "allow"
highlight = "all"

# Transitive duplicates we can't resolve (ecosystem version migrations).
# Revisit periodically — remove entries once the ecosystem catches up.
skip = [
    # sysfs_gpio 0.6.2 requires mio 0.8; tokio is on mio 1.
    { crate = "mio@0.8" },

    # ping 0.4.1 requires socket2 0.4; the workspace line is 0.6.
    { crate = "socket2@0.4" },

    # zip 9 requires nix 0.31 on macOS and the BSDs only; the workspace line is 0.30.
    { crate = "nix@0.31" },

    # ureq 3.4 requires base64 0.23.
    # Remove after the workspace, connectrpc, and usvg leave 0.22.
    { crate = "base64@0.23" },

    # rand 0.8 → 0.9 migration (see BDK-465).
    { crate = "getrandom@0.2" },
    { crate = "getrandom@0.3" },
    { crate = "rand@0.8" },
    { crate = "rand_chacha@0.3" },
    { crate = "rand_core@0.6" },

    # proptest and hickory already sit on rand 0.10;
    # the workspace, fake and smithay are on 0.9.
    { crate = "rand@0.10" },
    { crate = "rand_core@0.10" },
    { crate = "cpufeatures@0.3" },

    # Font/text ecosystem (cosmic-text pulls swash+harfrust with different versions)
    { crate = "roxmltree@0.20" },

    # bmc-svg-compiler pins usvg 0.45 while resvg pulls the 0.47 line
    { crate = "usvg@0.45" },
    { crate = "svgtypes@0.15" },
    { crate = "tiny-skia@0.11" },
    { crate = "tiny-skia-path@0.11" },
    { crate = "imagesize@0.13" },

    # gltf (sdk-macros) uses base64 0.13
    { crate = "base64@0.13" },

    # buffa 0.9 and tokio-util 0.7 require hashbrown 0.15 (and with it foldhash 0.1);
    # vello and jsonschema take 0.16, femtovg and rqrr through lru 0.16;
    # the workspace's own line is 0.17.
    { crate = "foldhash@0.1" },
    { crate = "hashbrown@0.15" },
    { crate = "hashbrown@0.16" },

    # formatjs_intl_macros (proc-macro, build host only) hashes message ids
    # with the sha2 0.11 line, while the workspace's sha1/sha2 stay on 0.10.
    # Remove once the workspace digests move to 0.11.
    { crate = "sha2@0.11" },
    { crate = "digest@0.11" },
    { crate = "block-buffer@0.12" },
    { crate = "crypto-common@0.2" },
    { crate = "cpufeatures@0.3" },

    # formatjs_intl_macros and the ICU4X 2 derives (zerovec-derive, yoke-derive)
    # parse with syn 3 and synstructure 0.14; every other derive is still on syn 2.
    # Remove once they move.
    { crate = "syn@3" },
    { crate = "synstructure@0.14" },

    # Wayland/Smithay ecosystem splits
    { crate = "calloop@0.13" },

    # winit and sctk-adwaita lag smithay-clipboard on smithay-client-toolkit
    { crate = "calloop-wayland-source@0.3" },
    { crate = "smithay-client-toolkit@0.19" },

    # Proc-macro splits: derive_builder stays on darling 0.20, serde_with is
    # on 0.24; packed_struct and ufmt still emit syn 1, async-trait,
    # clap_derive, darling 0.24 and schemars moved to syn 3, the workspace
    # and most of its macros sit on syn 2
    { crate = "darling@0.20" },
    { crate = "darling_core@0.20" },
    { crate = "darling_macro@0.20" },
    { crate = "syn@1" },
    { crate = "syn@3" },

    # Apple/ObjC framework splits (winit vs softbuffer vs egui)
    { crate = "block2@0.5" },
    { crate = "objc2@0.5" },
    { crate = "objc2-app-kit@0.2" },
    { crate = "objc2-foundation@0.2" },
    { crate = "objc2-ui-kit@0.2" },

    # eframe/egui ecosystem splits
    { crate = "glow@0.16" },
    { crate = "jni@0.21" },
    { crate = "jni-sys@0.3" },
    { crate = "kurbo@0.11" },

    # Widespread ecosystem splits
    { crate = "bitflags@1" },

    { crate = "itertools@0.13" },
    { crate = "linux-raw-sys@0.4" },
    { crate = "linux-raw-sys@0.9" },
    { crate = "memoffset@0.6" },
    { crate = "nix@0.23" },
    { crate = "nix@0.26" },
    { crate = "nix@0.29" },
    { crate = "redox_syscall@0.4" },
    { crate = "redox_syscall@0.5" },
    { crate = "rustix@0.38" },
    { crate = "shlex@1" },
    { crate = "smol_str@0.2" },
    { crate = "thiserror@1" },
    { crate = "thiserror-impl@1" },
    { crate = "winnow@0.7" },
    { crate = "hermit-abi@0.3" },
    { crate = "r-efi@5" },
    { crate = "winapi@0.3" },

    # Audio ecosystem (cpal/rodio pulls older ndk via oboe)
    { crate = "ndk@0.8" },
    { crate = "ndk-sys@0.5" },
]

# Platform crate trees with massive version fragmentation — skip subtrees.
skip-tree = [
    { crate = "windows@0.54" },
    { crate = "windows@0.61" },
    { crate = "windows-sys@0.45" },
    { crate = "windows-sys@0.48" },
    { crate = "windows-sys@0.52" },
    { crate = "windows-sys@0.59" },
    { crate = "windows-sys@0.60" },
]

# ── Licenses ──────────────────────────────────────────────────────────
# Workspace crates are GPL-3.0-or-later. Third-party license auditing is
# not checked in CI — enable if GPL-compatibility auditing is needed.

# ── Sources ───────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
# Every git source in every lockfile here is listed below, so an unlisted one
# is a new dependency nobody vetted rather than a gap in this list.
unknown-git = "deny"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
]
allow-git = [
    # Pinned upstream forks used in the workspace:
    # - smithay: pulled by bmc-widget (compositor) and bmc-openwrt
    # - tokio-cron-scheduler: pulled by bmc-scheduler
    # - rs-gallery: the gallery framework, in bmc-gallery's own lockfile only
    # - femtovg: carries the Gray8 glTexSubImage2D format fix; see Cargo.toml
    "https://github.com/BraiinsForge/femtovg.git",
    "https://github.com/BraiinsForge/tokio-cron-scheduler.git",
    "https://github.com/kubijo/rs-gallery.git",
    "https://github.com/Smithay/smithay.git",
]
