# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = true

# ── Advisories ────────────────────────────────────────────────────────
[advisories]
unmaintained = "workspace"

# ── Duplicate crate bans ─────────────────────────────────────────────
[bans]
multiple-versions = "deny"
wildcards = "allow"
highlight = "all"

# Transitive duplicates we can't resolve (ecosystem version migrations).
# Revisit periodically — remove entries once the ecosystem catches up.
skip = [
    # reqwest 0.11 → hyper 0.14 ecosystem (remove after upgrading to reqwest 0.12+)
    { crate = "base64@0.21" },
    { crate = "h2@0.3" },
    { crate = "http@0.2" },
    { crate = "http-body@0.4" },
    { crate = "hyper@0.14" },
    { crate = "mio@0.8" },
    { crate = "rustls@0.21" },
    { crate = "rustls-webpki@0.101" },
    { crate = "socket2@0.4" },
    { crate = "socket2@0.5" },
    { crate = "sync_wrapper@0.1" },
    { crate = "tower@0.4" },
    { crate = "webpki-roots@0.25" },

    # rand 0.8 → 0.9 migration (see BDK-465).
    { crate = "getrandom@0.2" },
    { crate = "getrandom@0.3" },
    { crate = "rand@0.8" },
    { crate = "rand_chacha@0.3" },
    { crate = "rand_core@0.6" },

    # Font/text ecosystem (cosmic-text pulls swash+harfrust with different versions)
    { crate = "font-types@0.10" },
    { crate = "read-fonts@0.35" },
    { crate = "skrifa@0.37" },
    { crate = "roxmltree@0.20" },
    { crate = "ttf-parser@0.21" },

    # prost ecosystem (tooling-std uses 0.12, tonic/bmc-grpc uses 0.13)
    { crate = "prost@0.12" },
    { crate = "prost-derive@0.12" },
    { crate = "prost-types@0.12" },

    # Slint pins older resvg/usvg/tiny-skia than workspace direct deps
    { crate = "resvg@0.45" },
    { crate = "usvg@0.45" },
    { crate = "svgtypes@0.15" },
    { crate = "tiny-skia@0.11" },
    { crate = "tiny-skia-path@0.11" },
    { crate = "imagesize@0.13" },
    { crate = "kurbo@0.11" },
    { crate = "roxmltree@0.20" },
    { crate = "quick-xml@0.38" },

    # syntect (via egui_extras) pulls bincode 1.x
    { crate = "bincode@1" },

    # egui/eframe transitive deps
    { crate = "jni@0.21" },
    { crate = "jni-sys@0.3" },

    # gltf (sdk-macros) uses base64 0.13
    { crate = "base64@0.13" },

    # Wayland/Smithay ecosystem splits
    { crate = "calloop@0.13" },
    { crate = "gbm@0.17" },
    { crate = "gbm-sys@0.3" },
    { crate = "wayland-client@0.31" },
    { crate = "wayland-cursor@0.31" },
    { crate = "wayland-protocols@0.29" },
    { crate = "wayland-scanner@0.31" },
    { crate = "wayland-sys@0.31" },

    # Apple/ObjC framework splits (winit vs softbuffer vs slint vs egui)
    { crate = "block2@0.5" },
    { crate = "core-foundation@0.9" },
    { crate = "objc2@0.5" },
    { crate = "objc2-app-kit@0.2" },
    { crate = "objc2-foundation@0.2" },
    { crate = "objc2-ui-kit@0.2" },

    # eframe/egui ecosystem splits (slint pulls older versions, eframe pulls newer)
    { crate = "foldhash@0.1" },
    { crate = "glow@0.16" },
    { crate = "jni@0.21" },
    { crate = "jni-sys@0.3" },
    { crate = "kurbo@0.11" },

    # Widespread ecosystem splits
    { crate = "bitflags@1" },

    { crate = "hashbrown@0.14" },
    { crate = "hashbrown@0.15" },
    { crate = "itertools@0.12" },
    { crate = "linux-raw-sys@0.4" },
    { crate = "linux-raw-sys@0.6" },
    { crate = "memoffset@0.6" },
    { crate = "nix@0.23" },
    { crate = "nix@0.24" },
    { crate = "nix@0.26" },
    { crate = "nix@0.29" },
    { crate = "png@0.17" },
    { crate = "redox_syscall@0.4" },
    { crate = "regex-automata@0.1" },
    { crate = "regex-syntax@0.6" },
    { crate = "rustc-hash@1" },
    { crate = "rustix@0.38" },
    { crate = "smol_str@0.2" },
    { crate = "thiserror@1" },
    { crate = "thiserror-impl@1" },
    { crate = "toml_datetime@0.6" },
    { crate = "toml_edit@0.22" },
    { crate = "aligned-vec@0.5" },
    { crate = "gif@0.13" },
    { crate = "zune-core@0.4" },
    { crate = "zune-jpeg@0.4" },
    { crate = "hermit-abi@0.3" },
    { crate = "hermit-abi@0.4" },
    { crate = "r-efi@5" },
    { crate = "winapi@0.3" },

    # Audio ecosystem (cpal/rodio pulls older ndk via oboe)
    { crate = "ndk@0.8" },
    { crate = "ndk-sys@0.5" },

    # minerctl-defs (tooling) still pulls schemars 0.8; bmc-widget-manifest is
    # on 1.x. Remove when minerctl-defs upgrades.
    { crate = "schemars@0.8" },
    { crate = "schemars_derive@0.8" },
]

# Platform crate trees with massive version fragmentation — skip subtrees.
skip-tree = [
    { crate = "windows@0.54" },
    { crate = "windows@0.61" },
    { crate = "windows-sys@0.45" },
    { crate = "windows-sys@0.48" },
    { crate = "windows-sys@0.52" },
    { crate = "windows-sys@0.59" },
    { crate = "windows-sys@0.60" },
]

# ── Licenses ──────────────────────────────────────────────────────────
# Not checked in CI — workspace crates are proprietary (license = "").
# Enable later if third-party license auditing is needed.

# ── Sources ───────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
    "sparse+http://registry.ii.zone/api/v1/crates/",
]
allow-git = [
    "ssh://git@gitlab.ii.zone/tooling/tooling.git",
    # Pinned upstream forks used in the workspace:
    # - egui_autocomplete: pulled by bmc-widget-wasm via bmc-wasm-runtime
    # - smithay: pulled by bmc-widget (compositor) and bmc-openwrt
    "https://github.com/yvind/egui_autocomplete.git",
    "https://github.com/Smithay/smithay.git",
]
