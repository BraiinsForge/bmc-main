[package]
name = "bmc-widget-protocol"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Braiins Systems s.r.o."]
description = "Wayland protocol extension for Deck widget communication"

# Wayland protocol XML read by wayland_scanner proc macros; the nix source
# filter keeps only rust/toml/lock unless a crate opts extra files in here.
[package.metadata.nix]
include = ["protocol/deck-widget-v1.xml"]

[dependencies]
bmc-shared-time.workspace = true
bmc-shared-utils.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
wayland-backend.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true
wayland-scanner.workspace = true
wayland-server.workspace = true

[lints]
workspace = true
