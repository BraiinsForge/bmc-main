[package]
name = "bmc-netsim"
version = "0.1.0"
edition = "2024"
authors = ["Braiins <braiins@braiins.com>"]
description = "Generic mDNS + REST network-resource simulator for driving widgets against fake devices"
readme = "README.md"

# Package the committed schema and blueprints into the crane source,
# so `blueprint_schema_is_current` and `every_committed_blueprint_parses`
# can read them in the nix sandbox.
[package.metadata.nix]
include = ["blueprint.schema.json", "blueprints/**"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
clap.workspace = true
codespan-reporting.workspace = true
fake.workspace = true
json5.workspace = true
mdns-sd.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
strsim.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
