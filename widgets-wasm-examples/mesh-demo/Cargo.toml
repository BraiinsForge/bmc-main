[package]
name = "mesh-demo"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

# Asset files embedded at compile time via the SDK include macros;
# the nix source filter keeps only rust/toml/lock unless opted in here.
[package.metadata.nix]
include = ["assets/**"]

[lib]
crate-type = ["cdylib"]

[dependencies]
bmc-wasm-sdk = { path = "../../bmc-wasm-runtime/sdk", features = ["math-3d"] }

[lints]
workspace = true
