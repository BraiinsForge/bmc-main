[package]
name = "bmc-upgrade"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Braiins <braiins@braiins.com>"]

# The profile wrapper template the validator compares uploads against;
# nix/wasm-widgets.nix reads it from here, since cargo packages only
# files inside the crate.
[package.metadata.nix]
include = ["assets/wasm-widget-wrapper.sh"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
bmc-nix.workspace = true
bmc-platform.workspace = true
bmc-scheduler.workspace = true
bmc-upgrade-types.workspace = true
bmc-wasm-protocol.workspace = true
bmc-widget-manifest.workspace = true
bytes.workspace = true
chrono.workspace = true
data-encoding.workspace = true
index-bmc.workspace = true
index-common.workspace = true
nix-archive.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
ring.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sysinfo = { workspace = true, features = ["linux-tmpfs"], optional = true }
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
futures.workspace = true
semver.workspace = true

[features]
disk-check = ["sysinfo"]
test-support = []

[lints]
workspace = true
