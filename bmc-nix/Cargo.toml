[package]
name = "bmc-nix"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
file-rotate.workspace = true
libc.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
walkdir.workspace = true

[dev-dependencies]
serial_test.workspace = true
tempfile.workspace = true

[[bin]]
name = "bmc-nix-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "bmc-hook-merge-files"
path = "src/bin/hooks/merge_files.rs"

[[bin]]
name = "bmc-hook-file-symlinks"
path = "src/bin/hooks/file_symlinks.rs"

[[bin]]
name = "bmc-hook-activation-resolver"
path = "src/bin/hooks/activation_resolver.rs"

[[bin]]
name = "bmc-nix-service-orchestrator"
path = "src/bin/service_orchestrator.rs"

[[bin]]
name = "bmc-activation-copy-files"
path = "src/bin/activation/copy_files.rs"

[lints]
workspace = true
