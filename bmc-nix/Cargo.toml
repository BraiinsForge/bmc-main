[package]
name = "bmc-nix"
version = "0.1.0"
edition = "2024"

# Embeds the sibling bmc-nix-init/servers.json via include_str!, and a test
# reads the core launcher definition to assert the orchestrator CLI shape; the
# nix source filter keeps only rust/toml/lock per crate otherwise.
[package.metadata.nix]
include = [
    "../bmc-nix-init/servers.json",
    "../nix/pkgs/core/default.nix",
]

[dependencies]
anyhow.workspace = true
base64.workspace = true
bmc-log.workspace = true
clap = { workspace = true, features = ["derive"] }
cognos.workspace = true
file-rotate.workspace = true
futures.workspace = true
libc.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
ring.workspace = true
semver.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
walkdir.workspace = true

[dev-dependencies]
serial_test.workspace = true
tempfile.workspace = true

[[bin]]
name = "bmc-nix-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "bmc-hook-merge-files"
path = "src/bin/hooks/merge_files.rs"

[[bin]]
name = "bmc-hook-file-symlinks"
path = "src/bin/hooks/file_symlinks.rs"

[[bin]]
name = "bmc-hook-activation-resolver"
path = "src/bin/hooks/activation_resolver.rs"

[[bin]]
name = "bmc-nix-service-orchestrator"
path = "src/bin/service_orchestrator.rs"

[[bin]]
name = "bmc-activation-copy-files"
path = "src/bin/activation/copy_files.rs"

[[bin]]
name = "bmc-activation-write-boundary"
path = "src/bin/activation/write_boundary.rs"

[lints]
workspace = true
