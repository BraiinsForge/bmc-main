include:
  - project: "nix/ci-tools"
    ref: &ci-tools-rev d74f0f33c361490b7ecb6d5e4f200de4d481ae34 # update using this command: `nix run .#ci-tools.update`
    file: "ci.yml"
    inputs:
      rev: *ci-tools-rev
      # Paths excluded from the host workspace's clippy/fmt sweep:
      # vendored upstream forks (linted upstream) and separate cargo
      # workspaces (wasm widgets — different target, own lint configs).
      workspace_lints_ignore: >-
        ./bmc-shared/ii-net
        ./bmc-shared/ii-net-drv
        ./bmc-shared/ii-dns
        ./bmc-wasm-runtime/examples
        ./widgets-wasm
      # shellcheck: redundant with content-checks (braiinschk shell=true).
      # unused-deps: cargo-machete needs per-crate triage first.
      disabled_jobs: ["shellcheck", "unused-deps"]

stages:
  - lint
  - dependencies
  - check
  - regression
  - apps

##################################
########## Lint Stage ############
##################################

# Override the included fmt job's script: the upstream check-fmt tool runs git
# with a sealed PATH that lacks git-lfs, which breaks `git diff` in this LFS-enabled repo.
# The `fmt-svg` pass is run here too because `nix fmt` (treefmt) does not format SVGs
# — the shared `git diff` check below then catches any un-svgo'd asset.
fmt:
  script:
    - nix fmt --no-write-lock-file -- --no-cache --verbose
    - nix run --no-write-lock-file .#fmt-svg
    - nix shell .#pkgs.git .#pkgs.git-lfs --command git diff --exit-code --color

verify-shared-crates:
  stage: lint
  needs: []
  script:
    - nix run .#verify-shared-crates -- --summary

cargo-deny:
  stage: lint
  needs: []
  script:
    - nix build -L .#checks.x86_64-linux.cargo-deny

cargo-deny-wasm:
  stage: lint
  needs: []
  script:
    - nix build -L .#checks.x86_64-linux.cargo-deny-wasm

no-fmt-in-wasm:
  stage: lint
  needs: []
  script:
    - nix build -L .#checks.x86_64-linux.no-fmt-in-wasm

clippy-wasm-widgets:
  stage: lint
  needs: []
  script:
    - nix build -L .#checks.x86_64-linux.clippy-wasm-widgets

"docs: wasm":
  stage: lint
  needs: []
  script:
    - nix build -L .#checks.x86_64-linux.docs-wasm

content-checks:
  stage: lint
  needs: []
  script:
    - nix build -L .#checks.x86_64-linux.content

binary-lfs-check:
  stage: lint
  needs: []
  variables:
    # `git merge-base` needs to see master; default GitLab depth (50) is shallow.
    GIT_DEPTH: 0
  script:
    - nix run .#check-binary-lfs

frontend-lint:
  stage: lint
  needs: []
  script:
    - nix build .#checks.x86_64-linux.lint

python-lint:
  stage: lint
  needs: []
  script:
    - nix build -L .#checks.x86_64-linux.python-lint

##################################
###### Dependencies Stage ########
##################################

workspace-deps:
  stage: dependencies
  needs: []
  script:
    - nix build .#workspace-deps --no-link

workspace-deps-armv7:
  stage: dependencies
  needs: []
  script:
    - nix build .#workspace-deps-armv7 --no-link

###################################
########### Check Stage ###########
###################################

python-check:
  stage: check
  needs: []
  script:
    - nix develop --command just python

build:
  stage: check
  needs:
    - workspace-deps
  script:
    - nix build .#build --no-link

clippy:
  stage: check
  needs:
    - workspace-deps
  script:
    - nix build .#clippy --no-link

test:
  stage: check
  needs:
    - workspace-deps
  script:
    - nix build .#nextest --no-link

test-armv7:
  stage: check
  needs:
    - workspace-deps-armv7
  # Full-workspace tests under qemu-arm are unproven (EGL/compositor
  # tests have no software GL stack in this profile yet).
  allow_failure: true
  script:
    - nix build .#nextest-armv7 --no-link

frontend-test:
  stage: check
  needs: []
  script:
    - nix build .#checks.x86_64-linux.test

test-wasm-widgets:
  stage: check
  needs: []
  script:
    - nix build -L .#checks.x86_64-linux.test-wasm-widgets

######################################
######## Regression Stage ############
######################################

wasm-regression:
  stage: regression
  needs:
    - workspace-deps
  tags: [nix]
  script:
    - nix build -L --keep-going .#checks.x86_64-linux.wasm-regression

############################
######## Apps Stage ########
############################

.app:
  extends: .artifacts
  stage: apps
  needs: []
  when: manual

bmc-mock:
  extends: .app
  script:
    - nix build .#bmc-mock

bmc-openwrt:
  extends: .app
  script:
    - nix build .#bmc-openwrt-armv7-release

frontend:
  extends: .app
  script:
    - nix build .#frontend
