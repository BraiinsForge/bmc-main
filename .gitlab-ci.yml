stages:
  - essentials
  - dependencies
  - check
  - apps

default:
  interruptible: true

.nix: &nix
  tags:
    - nix2

.artifacts: &artifacts
  # group ID 1001 is defined in 'D_UID' (file '.env') and is used in docker images
  # without chown the directories cannot be written and 'bos-publish' jobs do not work
  after_script:
    - shopt -s extglob dotglob
    - rm -rf !(result) && cp -Lr result/* . && rm -rf result && chmod +w -R * && chown -R 1001:1001 *
  artifacts:
    name: "${CI_JOB_NAME}_${CI_COMMIT_REF_SLUG}_${CI_JOB_ID}"
    when: always
    paths:
      - ./*
    expire_in: 1 week

##################################
######## Essentials Stage ########
##################################
fmt:
  <<: *nix
  stage: essentials
  needs: []
  script:
    - nix fmt --no-write-lock-file -- --no-cache --verbose
    - print-diff-after-fmt

flake.lock:
  <<: *nix
  stage: essentials
  needs: []
  # language=bash
  script:
    - verify-flake-lock

####################################
######## Dependencies Stage ########
####################################

workspace-deps:
  <<: *nix
  stage: dependencies
  needs: []
  script:
    - nix build .#workspace-deps --no-link

#############################
######## Check Stage ########
#############################

build:
  <<: *nix
  stage: check
  needs:
    - workspace-deps
  script:
    - nix build .#build --no-link

clippy:
  <<: *nix
  stage: check
  needs:
    - workspace-deps
  script:
    - nix build .#clippy --no-link

test:
  <<: *nix
  stage: check
  needs:
    - workspace-deps
  script:
    - nix build .#nextest --no-link

############################
######## Apps Stage ########
############################

.app: &app
  <<: *nix
  <<: *artifacts
  stage: apps
  needs: []
  when: manual

app:
  <<: *app
  script:
    - nix build .#app

