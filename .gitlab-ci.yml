stages:
  - essentials
  - dependencies
  - check
  - apps

##################################
######## Essentials Stage ########
##################################
variables:
  CI_TOOLS_REV: 6071d67e0c5ec498fc88017d36a54bb1b837ad83 # This is not accessible inside "include"
  WORKSPACE_LINTS_IGNORE_PATHS: "./bmc-shared/ii-net ./bmc-shared/ii-net-drv ./bmc-shared/ii-dns"

include:
  - project: "nix/ci-tools"
    ref: 6071d67e0c5ec498fc88017d36a54bb1b837ad83
    file:
      - ".essentials.yml"
      - ".dependencies.yml"
      - ".check.yml"
      - ".shellcheck.yml"

verify-shared-crates:
  extends: .nix
  stage: essentials
  script:
    - nix-shell -p jq getopt --run "./scripts/verify_crates.sh --summary"

############################
######## Apps Stage ########
############################

.app: &app
  extends: [.nix, .artifacts]
  stage: apps
  needs: []
  when: manual

bmc-mock:
  extends: .app
  script:
    - nix build .#bmc-mock

bmc-openwrt:
  extends: .app
  script:
    - nix build .#bmc-openwrt-armv7-release

frontend:
  extends: .app
  script:
    - nix build .#frontend
