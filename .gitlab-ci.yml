include:
  - project: "nix/ci-tools"
    ref: &ci-tools-rev 04e3dc45e9c46dbac75ce71079d9d2c3febb8433 # update using: `nix run git+ssh://git@gitlab.ii.zone/nix/ci-tools.git#update`
    file: "ci.yml"
    inputs:
      rev: *ci-tools-rev
      ci_tools_flake: "git+ssh://git@gitlab.ii.zone/nix/ci-tools.git?rev=04e3dc45e9c46dbac75ce71079d9d2c3febb8433"
      # Paths excluded from the host workspace's clippy/fmt sweep:
      # separate cargo workspaces (wasm widgets — different target, own
      # lint configs).
      workspace_lints_ignore: >-
        ./tooling
        ./widgets-wasm
        ./widgets-wasm-examples
        ./bmc-gallery
      # bmc-gallery sits outside the workspace so the gallery framework's egui
      # version stays clear of ours — leaving it no workspace to inherit either
      # dependencies or lints from, hence its entry in both lists.
      workspace_deps_ignore: "./bmc-gallery"
      # shellcheck: redundant with content-checks (braiinschk shell=true).
      # unused-deps: cargo-machete needs per-crate triage first.
      disabled_jobs: ["shellcheck", "unused-deps"]

stages:
  - lint
  - dependencies
  - check
  - regression
  - apps

##################################
########## Lint Stage ############
##################################

# Override the included fmt job's script: the upstream check-fmt tool runs git
# with a sealed PATH that lacks git-lfs, which breaks `git diff` in this LFS-enabled repo.
# The `fmt-svg` pass is run here too because `nix fmt` (treefmt) does not format SVGs
# — the shared `git diff` check below then catches any un-svgo'd asset.
fmt:
  script:
    - nix fmt --no-write-lock-file -- --no-cache --verbose
    - nix run --no-write-lock-file .#fmt-svg
    - nix shell .#pkgs.git .#pkgs.git-lfs --command git diff --exit-code --color

verify-shared-crates:
  stage: lint
  needs: []
  script:
    - nix run .#verify-shared-crates -- --summary

cargo-deny:
  stage: lint
  needs: []
  script:
    - nix build -L .#checks.x86_64-linux.cargo-deny

cargo-deny-wasm:
  stage: lint
  needs: []
  script:
    - nix build -L .#checks.x86_64-linux.cargo-deny-wasm
    - nix build -L .#checks.x86_64-linux.cargo-deny-wasm-examples

ast-grep:
  stage: lint
  needs: []
  script:
    - nix run .#ast-grep

"docs: wasm":
  stage: lint
  needs: []
  script:
    - nix build -L .#checks.x86_64-linux.docs-wasm

content-checks:
  stage: lint
  needs: []
  script:
    - nix run .#content-checks

public-widget-assets:
  stage: lint
  needs: []
  script:
    - nix build -L .#checks.x86_64-linux.public-widget-assets

license-headers:
  stage: lint
  needs: []
  script:
    - nix build -L .#checks.x86_64-linux.license-headers

binary-lfs-check:
  stage: lint
  needs: []
  variables:
    # `git merge-base` needs to see master; default GitLab depth (50) is shallow.
    GIT_DEPTH: 0
  script:
    - nix run .#check-binary-lfs

frontend-lint:
  stage: lint
  needs: []
  script:
    - nix build .#checks.x86_64-linux.lint

python-lint:
  stage: lint
  needs: []
  script:
    - nix build -L .#checks.x86_64-linux.python-lint

##################################
###### Dependencies Stage ########
##################################

workspace-deps-wasm-widgets:
  stage: dependencies
  needs: []
  script:
    - nix build .#workspace-deps-wasm-widgets --no-link

workspace-deps:
  stage: dependencies
  needs: []
  script:
    - nix build .#workspace-deps --no-link

workspace-deps-armv7:
  stage: dependencies
  needs: []
  script:
    - nix build .#workspace-deps-armv7 --no-link

workspace-deps-armv7-musl:
  stage: dependencies
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never
  script:
    - nix build .#workspace-deps-armv7-musl --no-link

gallery-deps:
  stage: dependencies
  needs: []
  script:
    - nix build .#gallery-deps --no-link

###################################
########### Check Stage ###########
###################################

# Built rather than checked: nothing else in CI codegens the scenes dylib.
gallery-build:
  stage: check
  needs:
    - gallery-deps
  script:
    - nix build -L .#checks.x86_64-linux.gallery-build

gallery-test:
  stage: check
  needs:
    - gallery-deps
  script:
    - nix build -L .#checks.x86_64-linux.gallery-test

# Separate from the build: clippy stops at check, so it never links the dylib.
gallery-clippy:
  stage: check
  needs:
    - gallery-deps
  script:
    - nix build -L .#checks.x86_64-linux.gallery-lints .#checks.x86_64-linux.gallery-clippy

# The gallery's lockfile is its own, so the workspace's cargo-deny never sees it.
gallery-deny:
  stage: check
  needs:
    - gallery-deps
  script:
    - nix build -L .#checks.x86_64-linux.gallery-deny

python-check:
  stage: check
  needs: []
  script:
    - nix develop --command just python
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: .tmp/coverage/python/coverage.xml

build:
  stage: check
  needs:
    - workspace-deps
  script:
    - nix build .#build --no-link

build-wasm-widgets:
  stage: check
  needs:
    - workspace-deps-wasm-widgets
  script:
    - nix build .#checks.x86_64-linux.build-wasm-widgets --no-link

test:
  stage: check
  needs:
    - workspace-deps
  script:
    - nix build .#nextest --no-link

test-armv7:
  stage: check
  needs:
    - workspace-deps-armv7
  script:
    - nix build .#nextest-armv7 --no-link

test-wasm-widgets:
  stage: check
  needs:
    - workspace-deps-wasm-widgets
  script:
    - nix build -L .#checks.x86_64-linux.test-wasm-widgets

clippy:
  stage: check
  needs:
    - workspace-deps
  script:
    - nix build .#clippy --no-link

clippy-wasm-widgets:
  stage: check
  needs:
    - workspace-deps-wasm-widgets
  script:
    - nix build -L .#checks.x86_64-linux.clippy-wasm-widgets

frontend-test:
  stage: check
  needs: []
  script:
    - nix build .#checks.x86_64-linux.test

######################################
######## Regression Stage ############
######################################

wasm-regression:
  stage: regression
  needs:
    - workspace-deps
  tags: [nix]
  script:
    # The report always builds and records the verdict as a passed/ or failed/
    # tree, so the artifacts are in place before the gate below fails on them.
    # --no-preserve=mode: store dirs are 0555, and a reused runner checkout
    # cannot clean an artifact tree it lacks write permission on.
    # Clear before building, not after: a reused checkout that fails the build
    # would otherwise upload the previous run's tree as this run's evidence.
    - rm -rf wasm-regression
    - nix build -L --keep-going .#wasm-regression-report --out-link result
    - cp -rL --no-preserve=mode result/. wasm-regression/
    - nix build -L .#checks.x86_64-linux.wasm-regression --no-link
  artifacts:
    when: always
    paths:
      - wasm-regression

deck-runtime-closure:
  stage: regression
  needs:
    - workspace-deps
    - workspace-deps-armv7
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes:
        compare_to: "refs/heads/$CI_DEFAULT_BRANCH"
        paths:
          - ".gitlab-ci.yml"
          - "Cargo.lock"
          - "flake.lock"
          - "*.nix"
          - "**/*.nix"
          - "frontend/.yarnrc.yml"
          - "frontend/justfile"
          - "frontend/package.json"
          - "frontend/rsbuild.config.ts"
          - "frontend/tsconfig.json"
          - "frontend/yarn.lock"
    - when: never
  tags: [nix]
  script:
    - nix build -L .#deck-runtime-closure --no-link

############################
######## Apps Stage ########
############################

.app:
  extends: .artifacts
  stage: apps
  needs: []
  when: manual

bmc-mock:
  extends: .app
  script:
    - nix build .#bmc-mock

bmc-openwrt:
  extends: .app
  script:
    - nix build .#bmc-openwrt-armv7-release

frontend:
  extends: .app
  script:
    - nix build .#frontend

init-tarball:
  extends: .app
  needs:
    - workspace-deps
    - workspace-deps-armv7
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - when: manual
      allow_failure: true
  script:
    - nix build .#init-tarball-armv7

bmc-nix-cli:
  extends: .app
  needs:
    - job: workspace-deps-armv7-musl
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - when: manual
      allow_failure: true
  script:
    - nix build .#bmc-nix-cli-armv7-release
