stages:
  - essentials
  - dependencies
  - check
  - apps

##################################
######## Essentials Stage ########
##################################
variables:
  CI_TOOLS_REV: 59c75c901a65e6f5136457b8f9e842d34e9d3abd # This is not accessible inside "include"
include:
  - project: 'nix/ci-tools'
    ref: 59c75c901a65e6f5136457b8f9e842d34e9d3abd
    file:
      - '.essentials.yml'
      - '.dependencies.yml'
      - '.check.yml'

############################
######## Apps Stage ########
############################

.app: &app
  extends: [.nix, .artifacts]
  stage: apps
  needs: []
  when: manual

bmc-mock:
  extends: .app
  script:
    - nix build .#bmc-mock

bmc-openwrt:
  extends: .app
  script:
    - nix build .#bmc-openwrt-armv7-release

web-assets:
  extends: .app
  script:
    - nix build .#web-assets
