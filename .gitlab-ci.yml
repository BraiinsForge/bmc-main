stages:
  - essentials
  - dependencies
  - check
  - apps

##################################
######## Essentials Stage ########
##################################
include:
  - project: 'nix/ci-tools'
    ref: master
    file:
      - '.essentials.yml'

####################################
######## Dependencies Stage ########
####################################

workspace-deps:
  extends: .nix
  stage: dependencies
  needs: []
  script:
    - nix build .#workspace-deps --no-link

#############################
######## Check Stage ########
#############################

build:
  extends: .nix
  stage: check
  needs:
    - workspace-deps
  script:
    - nix build .#build --no-link

clippy:
  extends: .nix
  stage: check
  needs:
    - workspace-deps
  script:
    - nix build .#clippy --no-link

test:
  extends: .nix
  stage: check
  needs:
    - workspace-deps
  script:
    - nix build .#nextest --no-link

############################
######## Apps Stage ########
############################

.app: &app
  extends: [.nix, .artifacts]
  stage: apps
  needs: []
  when: manual

bmc-mock:
  extends: .app
  script:
    - nix build .#bmc-mock

bmc-openwrt:
  extends: .app
  script:
    - nix build .#bmc-openwrt-armv7-release

web-assets:
  extends: .app
  script:
    - nix build .#web-assets
