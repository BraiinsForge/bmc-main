stages:
  - essentials
  - dependencies
  - check
  - regression
  - apps

##################################
######## Essentials Stage ########
##################################
variables:
  CI_TOOLS_REV: c75e453c0e3fd5fe167a9437b86e48b54c2aa81c # This is not accessible inside "include"
  WORKSPACE_LINTS_IGNORE_PATHS: "./bmc-shared/ii-net ./bmc-shared/ii-net-drv ./bmc-shared/ii-dns ./bmc-wasm-runtime/examples"

include:
  - project: "nix/ci-tools"
    ref: c75e453c0e3fd5fe167a9437b86e48b54c2aa81c
    file:
      - ".essentials.yml"
      - ".dependencies.yml"
      - ".check.yml"
      - ".shellcheck.yml"

verify-shared-crates:
  extends: .nix
  stage: essentials
  script:
    - nix-shell -p jq getopt --run "./scripts/verify_crates.sh --summary"

###################################
######## Frontend Checks ##########
###################################

frontend-lint:
  extends: .nix
  stage: check
  needs: []
  script:
    - nix build .#checks.x86_64-linux.lint

frontend-test:
  extends: .nix
  stage: check
  needs: []
  script:
    - nix build .#checks.x86_64-linux.test

###################################
########## Cargo Checks ###########
###################################

cargo-deny:
  extends: .nix
  stage: check
  needs: []
  script:
    - nix build -L .#checks.x86_64-linux.cargo-deny

###################################
########## Python Checks ##########
###################################

python-lint:
  extends: .nix
  stage: check
  needs: []
  script:
    - nix build -L .#checks.x86_64-linux.python-lint

######################################
######## Regression Stage ############
######################################

wasm-regression:
  extends: .nix
  stage: regression
  needs: []
  script:
    - nix run .#wasm-capture -- verify --output-dir=captures
  artifacts:
    when: on_failure
    paths:
      - captures/**/*
    expire_in: 7 days

############################
######## Apps Stage ########
############################

.app:
  extends: [.nix, .artifacts]
  stage: apps
  needs: []
  when: manual

bmc-mock:
  extends: .app
  script:
    - nix build .#bmc-mock

bmc-openwrt:
  extends: .app
  script:
    - nix build .#bmc-openwrt-armv7-release

frontend:
  extends: .app
  script:
    - nix build .#frontend
