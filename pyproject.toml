# Root marker for the Python uv workspace. The repository is primarily Rust;
# this only groups the in-repo Python packages so they share one lockfile and
# resolve each other by path. Members are listed explicitly — no auto-discovery.
[tool.uv.workspace]
members = [
    "bmc-tui",
    "bmc-virt/harness",
    "scripts",
]

# Shared dev tooling for the whole Python workspace,
# run via `uv run` (one venv covers the members).
[dependency-groups]
dev = [
    # Blender 5.0's API as stubs, for type-checking mesh-demo's scripts;
    # they run inside Blender, the only place `bpy` exists.
    "fake-bpy-module-5.0>=20260730",
    "grpcio>=1.60",
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.pytest.ini_options]
cache_dir = ".tmp/pytest_cache"
# importlib mode keeps the two same-named `tests` dirs from colliding.
addopts = "--import-mode=importlib --cov --cov-report=term-missing --cov-report=xml"
testpaths = [
    "bmc-tui/tests",
    "bmc-virt/harness/tests",
    "scripts/tests",
]

# Scoped to one package so the reported total
# is not diluted by an unmeasured one.
[tool.coverage.run]
source = ["bmc_tui"]
branch = true
data_file = ".tmp/coverage/python/.coverage"

[tool.coverage.report]
show_missing = true

# coverage.py's XML report is Cobertura, which is what GitLab ingests to annotate a diff;
# `python-check` in `.gitlab-ci.yml` names this path and has to move with it.
[tool.coverage.xml]
output = ".tmp/coverage/python/coverage.xml"

[tool.coverage.html]
directory = ".tmp/coverage/python/html"

# Every rule on; what the code already trips is grandfathered in `.basedpyright/baseline.json`.
# Each run drops the entries fixed since, and only `just python-baseline` adds new ones.
[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.13"

# The uv workspace's environment, so the editor resolves imports as `just python` does.
venvPath = "."
venv = ".venv"

# Setting `exclude` drops basedpyright's defaults, so they are restated.
# The iss-position tools are a uv project with their own venv and check.
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    "widgets-wasm/iss-position/tools",
]
executionEnvironments = [
    # Tests reach into internals on purpose.
    # The first env whose root holds a file wins, so each precedes its package's env.
    { root = "bmc-tui/tests", extraPaths = ["bmc-tui"], reportPrivateUsage = false },
    { root = "bmc-tui" },
    { root = "bmc-virt/harness/tests", extraPaths = ["bmc-virt/harness", "bmc-tui"], reportPrivateUsage = false },
    # bmc_tui as the in-repo source it is, not the untyped install the venv holds.
    { root = "bmc-virt/harness", extraPaths = ["bmc-tui"] },
    { root = "scripts" },
    # Run as files, so each script's own directory is on `sys.path` for its sibling imports.
    { root = "bmc-wasm-runtime/tools" },
    # Blender 4.0, the oldest the README supports, embeds Python 3.10.
    { root = "widgets-wasm-examples/mesh-demo/tools", pythonVersion = "3.10" },
]
