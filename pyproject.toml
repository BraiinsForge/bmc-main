# Root marker for the Python uv workspace. The repository is primarily Rust;
# this only groups the in-repo Python packages so they share one lockfile and
# resolve each other by path. Members are listed explicitly — no auto-discovery.
[tool.uv.workspace]
members = [
    "bmc-tui",
    "bmc-virt/harness",
]

# Shared dev tooling for the whole Python workspace, run via `uv run` (one venv covers both members).
[dependency-groups]
dev = [
    "grpcio>=1.60",
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.pytest.ini_options]
cache_dir = ".tmp/pytest_cache"
# importlib mode keeps the two same-named `tests` dirs from colliding.
addopts = "--import-mode=importlib --cov --cov-report=term-missing --cov-report=xml"
testpaths = [
    "bmc-tui/tests",
    "bmc-virt/harness/tests",
]

# Scoped to one package so the reported total is not diluted by an unmeasured one.
[tool.coverage.run]
source = ["bmc_tui"]
branch = true
data_file = ".tmp/coverage/python/.coverage"

[tool.coverage.report]
show_missing = true

# coverage.py's XML report is Cobertura, which is what GitLab ingests to annotate a diff;
# `python-check` in `.gitlab-ci.yml` names this path and has to move with it.
[tool.coverage.xml]
output = ".tmp/coverage/python/coverage.xml"

[tool.coverage.html]
directory = ".tmp/coverage/python/html"
