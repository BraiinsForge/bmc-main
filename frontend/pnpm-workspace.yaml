# Reviewed install scripts: IBM telemetry, the core-js banner,
# and binary fallbacks the optional platform packages make redundant.
allowBuilds:
  '@carbon/colors': false
  '@carbon/feature-flags': false
  '@carbon/grid': false
  '@carbon/icon-helpers': false
  '@carbon/icons-react': false
  '@carbon/layout': false
  '@carbon/motion': false
  '@carbon/react': false
  '@carbon/styles': false
  '@carbon/themes': false
  '@carbon/type': false
  '@carbon/utilities': false
  '@ibm/plex': false
  '@ibm/plex-mono': false
  '@ibm/plex-sans': false
  '@ibm/plex-sans-arabic': false
  '@ibm/plex-sans-devanagari': false
  '@ibm/plex-sans-hebrew': false
  '@ibm/plex-sans-thai': false
  '@ibm/plex-sans-thai-looped': false
  '@ibm/plex-serif': false
  '@parcel/watcher': false
  core-js: false
  esbuild: false

strictDepBuilds: true

savePrefix: ''

# Pulled in by Storybook's TypeScript docgen plugin (stable 1.0.1, via flat-cache 3),
# which never runs: we keep Storybook's default `react-docgen`.
allowedDeprecatedVersions:
  glob: 7.2.3
  inflight: 1.0.6
  rimraf: 3.0.2

# Unmet peers stay unmet, as under yarn: rspack stands in for the `webpack` peer
# that postcss-loader, sass-loader and the Storybook docgen plugin declare.
autoInstallPeers: false
peerDependencyRules:
  ignoreMissing:
    - webpack
  # react-popper 2.3.0 declares React up to 18; it runs on 19 regardless.
  allowedVersions:
    react-popper>react: '19'
    react-popper>react-dom: '19'

overrides:
  # React 19 marks elements with a symbol older react-is does not know;
  # prop-types, hoist-non-react-statics and pretty-format pull 16 to 18.
  react-is: ^19.0.0