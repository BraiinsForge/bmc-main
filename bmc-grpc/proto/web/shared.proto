syntax = "proto3";

package braiins.bmc.web;

// Structure representing a timezone
message Timezone {
  // Timezone ID
  string id = 1;
  // Timezone name
  string label = 2;
  // Timezone offset displayed as +HH:MM
  string offset = 3;
}

enum NumberFormat {
  NUMBER_FORMAT_UNSPECIFIED = 0;
  // 1 234 567,89  (space for thousands, comma for decimal)
  NUMBER_FORMAT_SPACE_GROUP_COMMA_DECIMAL = 1;
  // 1,234,567.89  (comma for thousands, dot for decimal)
  NUMBER_FORMAT_COMMA_GROUP_DOT_DECIMAL = 2;
  // 1.234.567,89  (dot for thousands, comma for decimal)
  NUMBER_FORMAT_DOT_GROUP_COMMA_DECIMAL = 3;
  // 1 234 567.89  (space for thousands, dot for decimal)
  NUMBER_FORMAT_SPACE_GROUP_DOT_DECIMAL = 4;
}

enum TimeFormat {
  TIME_FORMAT_UNSPECIFIED = 0;
  TIME_FORMAT_12_HOUR = 1;
  TIME_FORMAT_24_HOUR = 2;
}

enum DateFormat {
  DATE_FORMAT_UNSPECIFIED = 0;
  DATE_FORMAT_DD_MM_YYYY_DOT = 1;
  DATE_FORMAT_DD_MM_YYYY_SLASH = 2;
  DATE_FORMAT_D_M_YYYY_SLASH = 3;
  DATE_FORMAT_M_D_YYYY_SLASH = 4;
  DATE_FORMAT_DD_MM_YYYY_DASH = 5;
  DATE_FORMAT_YYYY_M_D_SLASH = 6;
  DATE_FORMAT_YYYY_MM_DD_DOT = 7;
  DATE_FORMAT_YYYY_MM_DD_DASH = 8;
}

message SoundInfo {
  string id = 1;
  string name = 2;
}

enum Weekday {
  WEEKDAY_UNSPECIFIED = 0;
  WEEKDAY_MONDAY = 1;
  WEEKDAY_TUESDAY = 2;
  WEEKDAY_WEDNESDAY = 3;
  WEEKDAY_THURSDAY = 4;
  WEEKDAY_FRIDAY = 5;
  WEEKDAY_SATURDAY = 6;
  WEEKDAY_SUNDAY = 7;
}

enum TemperatureUnit {
  TEMPERATURE_UNIT_UNSPECIFIED = 0;
  TEMPERATURE_UNIT_CELSIUS = 1;
  TEMPERATURE_UNIT_FAHRENHEIT = 2;
}

enum UnitSystem {
  UNIT_SYSTEM_UNSPECIFIED = 0;
  // km/h, km, kg, etc.
  UNIT_SYSTEM_METRIC = 1;
  // mph, miles, lbs, etc.
  UNIT_SYSTEM_IMPERIAL = 2;
}

// RGB color (0-255 per channel)
message RgbColor {
  uint32 r = 1; // 0-255
  uint32 g = 2; // 0-255
  uint32 b = 3; // 0-255
}

// LED animation effects
enum LedEffect {
  LED_EFFECT_UNSPECIFIED = 0;
  LED_EFFECT_NONE = 1;
  LED_EFFECT_SOLID = 2;
  LED_EFFECT_BREATHE = 3;
  LED_EFFECT_CHASE = 4;
  LED_EFFECT_KNIGHT_RIDER = 5;
  LED_EFFECT_SCAN = 6;
  LED_EFFECT_SNAKE = 7;
}
