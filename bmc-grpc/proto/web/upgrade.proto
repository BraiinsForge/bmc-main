syntax = "proto3";

package braiins.bmc.web;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "web/scene_management.proto";

enum AutoUpgradeFrequency {
  AUTO_UPGRADE_FREQUENCY_UNSPECIFIED = 0;
  AUTO_UPGRADE_FREQUENCY_DAILY = 1;
  AUTO_UPGRADE_FREQUENCY_WEEKLY = 2;
  AUTO_UPGRADE_FREQUENCY_BI_WEEKLY = 3;
  AUTO_UPGRADE_FREQUENCY_MONTHLY = 4;
}

message ReleaseInfo {
  string version = 1;
  string description = 2;
}

message FirmwareUpgrade {
  string hash = 1;
  string version = 2;
  google.protobuf.Timestamp release_date = 3;
  string description = 4;
  uint64 file_size_bytes = 5;
  repeated ReleaseInfo previous_releases = 6;
}

message PackageChange {
  string name = 1;
  optional string version_from = 2;
  optional string version_to = 3;
  optional string category = 4;
  optional string changelog = 5;
}

message PackageUpgradePlan {
  repeated PackageChange changes = 1;
  optional uint64 download_size_bytes = 2;
  optional string bmc_version = 3;
  optional string bmc_changelog = 4;
}

enum UpgradeDisruption {
  UPGRADE_DISRUPTION_UNSPECIFIED = 0;
  UPGRADE_DISRUPTION_APP_RESTART = 1;
  UPGRADE_DISRUPTION_REBOOT = 2;
}

message CheckForUpgradeResponse {
  optional string upgrade_id = 1;
  optional FirmwareUpgrade firmware = 2;
  optional PackageUpgradePlan packages = 3;
  UpgradeDisruption disruption = 4;
}

message CheckForUpgradeRequest {
  repeated string install_packages = 1;
}

message InstallablePreview {
  string image = 1;
  // Scene size the preview depicts (e.g. "full", "medium", "small_left").
  // Free-form so future sizes this build does not know still round-trip.
  string size = 2;
}

message InstallableWidget {
  string package_name = 1;
  string uid = 2;
  string version = 3;
  string display_name = 4;
  optional string subname = 5;
  // Unknown/unrecognized index categories arrive as WIDGET_CATEGORY_UNSPECIFIED.
  WidgetCategory category = 6;
  optional string description = 7;
  optional string icon = 8;
  repeated InstallablePreview previews = 9;
  repeated WidgetSize supported_sizes = 10;
}

message GetInstallableWidgetsResponse {
  repeated InstallableWidget widgets = 1;
}

message StartUpgradeRequest {
  string upgrade_id = 1;
}

message UpgradeDownloadProgress {
  uint64 downloaded_bytes = 1;
  optional uint64 total_bytes = 2;
}

enum PackageUpgradePhase {
  PACKAGE_UPGRADE_PHASE_UNSPECIFIED = 0;
  // Realizing is where the packages are downloaded (substituted from the servers).
  PACKAGE_UPGRADE_PHASE_REALIZING = 1;
  PACKAGE_UPGRADE_PHASE_VERIFYING = 2;
  PACKAGE_UPGRADE_PHASE_BUILDING = 3;
  PACKAGE_UPGRADE_PHASE_ACTIVATING = 4;
}

enum FirmwareUpgradePhase {
  FIRMWARE_UPGRADE_PHASE_UNSPECIFIED = 0;
  FIRMWARE_UPGRADE_PHASE_DOWNLOADING = 1;
  FIRMWARE_UPGRADE_PHASE_VERIFYING = 2;
  FIRMWARE_UPGRADE_PHASE_APPLYING = 3;
}

message UpgradeProgress {
  oneof event {
    UpgradeDownloadProgress download = 1;
    PackageUpgradePhase package_phase = 2;
    FirmwareUpgradePhase firmware_phase = 3;
    // Only package upgrades emit `finished`. A firmware upgrade ends the stream
    // with a clean terminating status right after FIRMWARE_UPGRADE_PHASE_APPLYING
    // and no `finished`; the device then reboots. If the connection is lost
    // after APPLYING without that clean close, treat it as success too — the
    // reboot can sever the stream first.
    google.protobuf.Empty finished = 4;
  }
}

message SetAutoUpgradeRequest {
  bool enabled = 1;
  optional AutoUpgradeFrequency frequency = 2;
  optional uint32 hour = 3;
  optional uint32 minute = 4;
}

message GetAutoUpgradeResponse {
  bool enabled = 1;
  optional AutoUpgradeFrequency frequency = 2;
  optional uint32 hour = 3;
  optional uint32 minute = 4;
}

service UpgradeService {
  rpc CheckForUpgrade(CheckForUpgradeRequest) returns (CheckForUpgradeResponse);
  rpc GetInstallableWidgets(google.protobuf.Empty) returns (GetInstallableWidgetsResponse);
  rpc StartUpgrade(StartUpgradeRequest) returns (stream UpgradeProgress);
  // Allows en/disabling of AutoUpgrade feature
  rpc SetAutoUpgrade(SetAutoUpgradeRequest) returns (google.protobuf.Empty);
  // Returns the current AutoUpgrade configuration and status
  rpc GetAutoUpgrade(google.protobuf.Empty) returns (GetAutoUpgradeResponse);
}
