syntax = "proto3";

package braiins.bmc.web;

import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";
import "web/shared.proto";

message BrightnessInfo {
  uint32 value = 1;
  uint32 min = 2;
  uint32 max = 3;
  uint32 step = 4;
}

message DisplaySettingsResponse {
  BrightnessInfo brightness = 1;
  BrightnessInfo brightness_nightmode = 2;
  bool nightmode_enabled = 3;
  TimeInterval nightmode_interval = 4;
}

message TimeInterval {
  string from = 1; // Expected format: HH:MM, Range 00:00 - 23:59
  string to = 2; // Expected format: HH:MM, Range 00:00 - 23:59
}

message SoundVolume {
  uint32 value = 1;
  uint32 min = 2;
  uint32 max = 3;
  uint32 step = 4;
}

message SoundVolumeSettingsResponse {
  SoundVolume volume = 1;
  SoundVolume volume_nightmode = 2;
}

message ListSoundsResponse {
  repeated braiins.bmc.web.SoundInfo sounds = 1;
}

message PlaySoundRequest {
  string sound_id = 1;
}

service ConfigurationService {
  rpc SetBrightness(google.protobuf.UInt32Value) returns (google.protobuf.Empty);
  rpc GetDisplaySettings(google.protobuf.Empty) returns (DisplaySettingsResponse);
  rpc SetBrightnessNightmode(google.protobuf.UInt32Value) returns (google.protobuf.Empty);
  rpc SetNightmodeEnabled(google.protobuf.BoolValue) returns (google.protobuf.Empty);
  rpc SetNightmodeInterval(TimeInterval) returns (google.protobuf.Empty);
  rpc GetSoundVolumeSettings(google.protobuf.Empty) returns (SoundVolumeSettingsResponse);
  rpc SetSoundVolume(google.protobuf.UInt32Value) returns (google.protobuf.Empty);
  rpc SetSoundVolumeNightmode(google.protobuf.UInt32Value) returns (google.protobuf.Empty);
  rpc ListSounds(google.protobuf.Empty) returns (ListSoundsResponse);
  rpc PlaySound(PlaySoundRequest) returns (google.protobuf.Empty);
}
