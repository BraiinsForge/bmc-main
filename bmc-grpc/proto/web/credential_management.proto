syntax = "proto3";

package braiins.bmc.web;

import "google/protobuf/empty.proto";
import "web/field_schema.proto";

// A kind of account a widget can bind. Each field key is the interpolation variable a widget
// embeds in its outbound request.
message CredentialType {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated ManifestParamDefinition fields = 4;
  // Absent means the resolved secret may be sent anywhere.
  EgressPolicy egress = 5;
  // Absent means the frontend renders its own generic glyph.
  optional Icon icon = 6;
}

// Artwork carried inline rather than behind a URL, so it does not
// depend on the type having a directory to be served from.
//
// Firmware bakes its own; a type admitted from elsewhere
// can carry one the same way, whatever produced the bytes.
message Icon {
  // IANA media type of `data`, e.g. "image/svg+xml".
  string mime_type = 1;
  // Base64 of the icon bytes, so any format
  // the frontend can render travels unchanged.
  string data = 2;
}

message EgressPolicy {
  repeated string allow_hosts = 1;
}

message GetCredentialTypesResponse {
  repeated CredentialType credential_types = 1;
}

service CredentialManagementService {
  // List the credential types a widget's account slots can be filled with.
  rpc GetCredentialTypes(google.protobuf.Empty) returns (GetCredentialTypesResponse);
}
