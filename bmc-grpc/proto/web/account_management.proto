syntax = "proto3";

package braiins.bmc.web;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

// A saved account — a typed instance of a credential type.
// Secret field values are write-only: set via UpsertAccount.
message Account {
  string id = 1;
  // Credential-type id (e.g. "braiins-pool").
  string type_id = 2;
  string name = 3;
  google.protobuf.Timestamp created_at = 4;
  // Widget instances currently bound to this account.
  repeated string connected_widgets = 5;
}

message GetAllAccountsResponse {
  repeated Account accounts = 1;
}

message UpsertAccountRequest {
  // Empty to create; an existing account id to update.
  string id = 1;
  // Required on create; ignored on update.
  string type_id = 2;
  string name = 3;
  // Secret values keyed by the credential type's field key.
  // On update, leave empty to keep the stored values.
  map<string, string> field_values = 4;
}

service AccountManagementService {
  // List saved accounts (without secret values).
  rpc GetAllAccounts(google.protobuf.Empty) returns (GetAllAccountsResponse);
  // Create (empty id) or update an account. Returns the account id.
  rpc UpsertAccount(UpsertAccountRequest) returns (google.protobuf.StringValue);
  // Delete an account by id.
  rpc RemoveAccount(google.protobuf.StringValue) returns (google.protobuf.Empty);
}
