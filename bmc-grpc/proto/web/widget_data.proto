syntax = "proto3";

package braiins.bmc.web;

import "google/protobuf/empty.proto";

message WidgetDataValue {
  oneof kind {
    google.protobuf.Empty null_value = 1;
    bool boolean_value = 2;
    int32 integer_value = 3;
    double double_value = 4;
    string string_value = 5;
  }
}

message WidgetDataStruct {
  map<string, WidgetDataValue> fields = 1;
}
