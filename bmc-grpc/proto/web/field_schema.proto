syntax = "proto3";

package braiins.bmc.web;

// Shared schema-driven form field vocabulary — the wire mirror of the Rust `bmc-field-schema` crate.
// Reused by every schema that wants the same declarative form rendering: widget manifest params and
// credential-type fields.

// is_optional and per-variant default_value combine to express the four
// possible param states:
//
//   is_optional=false + default_value present: required field with default
//   is_optional=false + default_value absent:  manifest rejected at load
//   is_optional=true  + default_value present: optional, default-on-add
//   is_optional=true  + default_value absent:  optional, null-on-add
//
// On the wire WidgetDataValue.null_value is only legal for is_optional=true.
message ManifestParamDefinition {
  string key = 1;
  string name = 2;
  optional string description = 3;
  bool is_optional = 4;
  oneof kind {
    ParamString param_string = 5;
    ParamDouble param_double = 6;
    ParamInteger param_integer = 7;
    ParamBoolean param_boolean = 8;
    ParamTimezone param_timezone = 9;
  }
}

message ParamString {
  optional StringFormat format = 1;
  repeated StringOption enum_values = 2;
  optional string default_value = 3;
}

message StringOption {
  string value = 1;
  string label = 2;
}

enum StringFormat {
  STRING_FORMAT_UNSPECIFIED = 0;
  STRING_FORMAT_DATE = 1;
  STRING_FORMAT_TIME = 2;
  STRING_FORMAT_EMAIL = 3;
  STRING_FORMAT_URI = 4;
  STRING_FORMAT_PASSWORD = 5;
}

message ParamDouble {
  optional double min = 1;
  optional double max = 2;
  optional double step = 3;
  repeated DoubleOption enum_values = 4;
  optional double default_value = 5;
}

message DoubleOption {
  double value = 1;
  string label = 2;
}

message ParamInteger {
  optional int32 min = 1;
  optional int32 max = 2;
  optional int32 step = 3;
  repeated IntegerOption enum_values = 4;
  optional int32 default_value = 5;
}

message IntegerOption {
  int32 value = 1;
  string label = 2;
}

message ParamBoolean {
  optional bool default_value = 1;
}

message ParamTimezone {
  optional string default_value = 1;
}
