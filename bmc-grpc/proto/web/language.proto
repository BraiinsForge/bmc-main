syntax = "proto3";

package braiins.bmc.web;

import "google/protobuf/empty.proto";
import "web/shared.proto";

enum TextDirection {
  TEXT_DIRECTION_UNSPECIFIED = 0;
  TEXT_DIRECTION_LTR = 1;
  TEXT_DIRECTION_RTL = 2;
}

// A language the device speaks, as its pickers show it.
message LanguageInfo {
  // BCP-47, the form the language setting takes.
  string tag = 1;
  // The language named in itself.
  string native_name = 2;
  TextDirection text_direction = 3;
  // Absent for a language whose pack brings none; the picker names it alone.
  optional Icon flag = 4;
}

message ListLanguagesResponse {
  // British and American English first, then the language packs the device read.
  repeated LanguageInfo languages = 1;
}

// The languages the device speaks.
// Public, so a page can offer them before anyone logs in.
service LanguageService {
  rpc ListLanguages(google.protobuf.Empty) returns (ListLanguagesResponse);
}
