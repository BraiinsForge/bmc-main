syntax = "proto3";

package braiins.bmc.web;

import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";

message Scene {
  string id = 1;
  bool enabled = 2;
  // optional, empty value means - use default cycle duration, minimum 1
  optional uint32 cycle_duration_sec = 3;
  oneof kind {
    Fullscreen fullscreen = 4;
    Combined combined = 5;
  }

  message Fullscreen {
    Widget widget = 1;
  }

  message Combined {
    repeated Widget widgets = 1;
  }
}

message GetScenesResponse {
  // sorted by position, asc
  repeated Scene scenes = 1;
}

message AddFullscreenSceneRequest {
  WidgetConfig config = 1;
}

message UpdateSceneRequest {
  string id = 1;
  bool enabled = 2;
  // optional, empty value means - use default cycle duration, minimum 1
  optional uint32 cycle_duration_sec = 3;
}

message MoveSceneRequest {
  string id = 1;
  // zero based
  uint32 index = 2;
}

message SceneResponse {
  Scene scene = 1;
}

// Position of the widget on the combined scene grid.
// Full screen widget position is row: 0, col: 0.
message WidgetPosition {
  uint32 row = 1;
  uint32 col = 2;
}

enum WidgetSize {
  WIDGET_SIZE_UNSPECIFIED = 0;
  WIDGET_SIZE_SMALL = 1;
  WIDGET_SIZE_MEDIUM = 2;
  WIDGET_SIZE_LARGE = 3;
  WIDGET_SIZE_FULL = 4;
}

message WidgetConfig {
  // UID of the manifest
  string widget_uid = 1;
  // Parameter values (key → JSON-encoded value).
  map<string, string> params = 2;
}

// A widget instance placed in a scene. Every widget is driven by a manifest;
// its identity is the manifest UID, its configuration is the params map.
message Widget {
  string id = 1;
  WidgetPosition position = 2;
  WidgetSize size = 3;
  WidgetConfig config = 4;
}

message AddWidgetRequest {
  string scene_id = 1;
  WidgetPosition position = 2;
  WidgetSize size = 3;
  WidgetConfig config = 4;
}

message UpdateWidgetRequest {
  string id = 1;
  string scene_id = 2;
  WidgetPosition position = 3;
  WidgetSize size = 4;
  // Parameter values set by user (key → JSON-encoded value)
  map<string, string> params = 5;
}

message RemoveWidgetRequest {
  string id = 1;
  string scene_id = 2;
}

message WidgetResponse {
  Widget widget = 1;
}

enum SceneCyclingTransition {
  SCENE_CYCLING_TRANSITION_UNSPECIFIED = 0;
  SCENE_CYCLING_TRANSITION_SLIDE = 1;
  SCENE_CYCLING_TRANSITION_FADE = 2;
}

message SceneCycling {
  bool automatic_cycling_enabled = 1;
  // minimum 1
  uint32 automatic_cycling_default_duration_sec = 2;
  SceneCyclingTransition transition = 3;
}

message GetSceneCyclingResponse {
  SceneCycling scene_cycling = 1;
}

message SetSceneCyclingRequest {
  SceneCycling scene_cycling = 1;
}

// ── Manifest-driven widget system ──────────────────────────────────────
//
// Widget parameters are described by custom manifest format.

message WidgetManifest {
  // Widget UID (UUID v4 from manifest.json)
  string uid = 1;
  string name = 2;
  string description = 3;
  string version = 4;
  // Author info
  optional string author_name = 5;
  optional string author_url = 6;
  // Sizes this widget supports (subset of WidgetSize)
  repeated WidgetSize supported_sizes = 7;
  // Parameter definitions — frontend generates form inputs from these
  repeated ManifestParamDefinition params = 8;
}

message ManifestParamDefinition {
  // Parameter key (used in the params map when configuring a widget)
  string key = 1;
  // Human-readable label
  string name = 2;
  // Parameter type
  ManifestParamType param_type = 3;
  // Optional description / help text
  optional string description = 4;
  // Default value as JSON string
  string default_value = 5;
  // For enum types: map of value → display label
  map<string, string> enum_values = 6;
  // For number types: optional range constraints
  optional double min = 7;
  optional double max = 8;
}

enum ManifestParamType {
  MANIFEST_PARAM_TYPE_UNSPECIFIED = 0;
  MANIFEST_PARAM_TYPE_STRING = 1;
  MANIFEST_PARAM_TYPE_BOOLEAN = 2;
  MANIFEST_PARAM_TYPE_NUMBER = 3;
  MANIFEST_PARAM_TYPE_ARRAY = 4;
  MANIFEST_PARAM_TYPE_TIMEZONE = 5;
}

message GetAvailableWidgetsResponse {
  repeated WidgetManifest widgets = 1;
}

// Configures scenes & widgets for individual scenes.
// CQRS pattern: commands only modify state, queries only return state.
// FE should fetch scene(s) after executing a command to sync its view.
//
// FE implementation tips:
//
// add new scene:
// - combined:
//   - call `AddCombinedScene`
//     - creates empty scene without any widgets
//     - response contains ID of newly created scene
//   - redirect user to page with grid
//   - call `GetScene`
//   - call `PreviewScene` & keep stream open while user is on grid page
// - fullscreen:
//   - call `AddFullscreenScene` with the chosen widget manifest UID
//     - creates scene with single fullscreen widget (with manifest defaults
//       unless overridden in `params`)
//     - response contains ID of newly created scene
//   - call `GetScene` & show modal to edit fullscreen widget
//   - call `PreviewScene` & keep stream open while modal is open
//
// update scene:
// - combined & fullscreen:
//   - call `UpdateScene`
//   - call `GetScene`
//
// move scene:
// - combined & fullscreen:
//   - call `MoveScene`
//   - call `GetScenes`
//
// clone scene:
// - combined & fullscreen:
//   - call `CloneScene`
//   - call `GetScenes`
//
// remove scene:
// - combined & fullscreen:
//   - call `RemoveScene`
//   - call `GetScenes`
//
// add widget:
// - combined:
//   - call `AddWidget` with the chosen widget manifest UID and optional
//     param overrides.
//     - response contains ID of newly created widget
//   - call `GetScene` & show modal to edit new widget
//
// update widget:
// - combined & fullscreen:
//   - call `UpdateWidget` with the full params map
//   - call `GetScene`
//
// remove widget:
// - combined & fullscreen:
//   - call `RemoveWidget`
//   - call `GetScene`
service SceneManagementService {
  // Get all scenes
  rpc GetScenes(google.protobuf.Empty) returns (GetScenesResponse);
  // Get single scene by ID. Optimization for FE to avoid fetching all scenes.
  rpc GetScene(google.protobuf.StringValue) returns (SceneResponse);
  // Add fullscreen scene containing a single widget at position (0, 0).
  // Returns ID of the new scene.
  rpc AddFullscreenScene(AddFullscreenSceneRequest) returns (google.protobuf.StringValue);
  // Add combined scene without any widgets.
  // Returns ID of the new scene.
  rpc AddCombinedScene(google.protobuf.Empty) returns (google.protobuf.StringValue);
  // Update common properties of a scene (enabled, cycle duration). Not widgets.
  // Full update, not patch.
  rpc UpdateScene(UpdateSceneRequest) returns (google.protobuf.Empty);
  // Move scene to a different index.
  rpc MoveScene(MoveSceneRequest) returns (google.protobuf.Empty);
  // Clone scene by ID, placed right next to it (index + 1).
  // Returns ID of the new scene.
  rpc CloneScene(google.protobuf.StringValue) returns (google.protobuf.StringValue);
  // Remove scene by ID.
  rpc RemoveScene(google.protobuf.StringValue) returns (google.protobuf.Empty);
  // Keep preview scene shown on the display while the stream is open.
  // Takes scene ID as an argument.
  rpc PreviewScene(google.protobuf.StringValue) returns (stream google.protobuf.Empty);
  // Add widget to a scene from a manifest. Returns ID of the new widget.
  rpc AddWidget(AddWidgetRequest) returns (google.protobuf.StringValue);
  // Update widget params by ID. Full update of the params map, not patch.
  rpc UpdateWidget(UpdateWidgetRequest) returns (google.protobuf.Empty);
  // Remove widget by ID.
  rpc RemoveWidget(RemoveWidgetRequest) returns (google.protobuf.Empty);
  // Get scene cycling configuration.
  rpc GetSceneCycling(google.protobuf.Empty) returns (GetSceneCyclingResponse);
  // Set scene cycling configuration.
  rpc SetSceneCycling(SetSceneCyclingRequest) returns (google.protobuf.Empty);

  // ── Manifest registry RPCs ──────────────────────────────────────
  // Get all installed widget manifests (for the widget picker UI).
  rpc GetAvailableWidgets(google.protobuf.Empty) returns (GetAvailableWidgetsResponse);
  // Get a single widget manifest by UID.
  rpc GetWidgetManifest(google.protobuf.StringValue) returns (WidgetManifest);
}
