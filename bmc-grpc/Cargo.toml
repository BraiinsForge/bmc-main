[package]
name = "bmc-grpc"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

# Bindings are generated by `just gen` into src/gen (see buf.gen.yaml).
# Without features the crate is the message types only (bmc-virt/relay);
# `server` adds the connectrpc service traits, `client` the generated clients.
[features]
server = ["dep:connectrpc"]
client = ["server", "connectrpc/client"]

[dependencies]
buffa.workspace = true
buffa-types.workspace = true
connectrpc = { workspace = true, optional = true }

[lints]
workspace = true
