[package]
name = "bmc-compositor"
version = "0.1.0"
edition = "2024"
authors = ["Braiins Systems s.r.o."]
description = "Wayland compositor for BMC widget display"

[[bin]]
name = "bmc-compositor"
path = "src/main.rs"

[[bin]]
name = "bmc-compositor-egl"
path = "src/main_egl.rs"

[dependencies]
anyhow.workspace = true
calloop.workspace = true
drm.workspace = true
drm-fourcc.workspace = true
gbm.workspace = true
input.workspace = true
libc.workspace = true
smithay.workspace = true
smithay-drm-extras.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
udev.workspace = true

[lints]
workspace = true
