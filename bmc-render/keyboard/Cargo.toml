[package]
name = "bmc-render-keyboard"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

# Layout XML (read by build.rs), key sounds, icon SVGs and skins are embedded
# at compile time; the nix source filter keeps only rust/toml/lock otherwise.
[package.metadata.nix]
include = ["assets/**"]

[dependencies]
bmc-render = { path = ".." }
bmc-render-macros = { path = "../macros" }
bmc-render-skin = { path = "../skin" }
bmc-wasm-protocol = { path = "../../bmc-wasm-runtime/protocol" }
bmc-wasm-sdk = { path = "../../bmc-wasm-runtime/sdk" }
tracing.workspace = true

[dev-dependencies]
bmc-render = { path = "..", features = ["test-support"] }

[build-dependencies]
roxmltree.workspace = true

[lints]
workspace = true
