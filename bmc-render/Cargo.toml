[package]
name = "bmc-render"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow.workspace = true
bmc-render-skin = { path = "skin" }
bmc-wasm-protocol = { path = "../bmc-wasm-runtime/protocol" }
ii-stopwatch.workspace = true
tracing.workspace = true

# 3D math (quaternions, matrices, vectors)
glam.workspace = true

# Rendering
cosmic-text.workspace = true
femtovg.workspace = true
glow.workspace = true
image = { workspace = true, features = ["jpeg", "png"] }
imgref.workspace = true
jpeg-decoder.workspace = true
rgb.workspace = true

# Layout
taffy.workspace = true

[build-dependencies]
bmc-svg-compiler = { path = "../bmc-wasm-runtime/svg-compiler" }
bmc-wasm-protocol = { path = "../bmc-wasm-runtime/protocol" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Headless GL setup for integration tests
# (mirrors the `capture` binary's llvmpipe-via-EGL path).
glutin.workspace = true

[features]
default = []
profiling = ["ii-stopwatch/enabled"]

[lints]
workspace = true
