[package]
name = "bmc-render"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

# Fonts embedded via include_bytes! from the top-level assets tree, this crate's
# own icon/bitmap/mesh assets (build.rs and its scenes), plus the few cross-crate
# assets those `*.scene.rs` reference. The nix source filter keeps only
# rust/toml/lock unless a crate opts extra files here.
[package.metadata.nix]
include = [
    "../assets/fonts/*",
    "assets/**",
    "../bmc-wasm-runtime/sdk/assets/icons/star.svg",
]

[dependencies]
anyhow.workspace = true
bmc-render-skin = { path = "skin" }
bmc-wasm-protocol = { path = "../bmc-wasm-runtime/protocol", features = ["id-pool"] }
ii-stopwatch.workspace = true
tracing.workspace = true

# Rendering
cosmic-text.workspace = true
etagere.workspace = true
femtovg.workspace = true
glam.workspace = true
glow.workspace = true
hashbrown.workspace = true
image.workspace = true
imgref.workspace = true
jpeg-decoder.workspace = true
qrcodegen.workspace = true
rgb.workspace = true
taffy.workspace = true

[build-dependencies]
bmc-svg-compiler = { path = "../bmc-wasm-runtime/svg-compiler" }
bmc-wasm-protocol = { path = "../bmc-wasm-runtime/protocol" }

[dev-dependencies]
rqrr.workspace = true
# `tracing::subscriber::with_default` is std-gated, and the workspace pins
# tracing with default features off; the glyph cache's rate-limited
# diagnostics can only be counted by attaching a subscriber in-test.
tracing = { workspace = true, features = ["std"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
glutin.workspace = true

# The allocation gate is an integration test, which links this library *without*
# `cfg(test)` — so the GL harness it drives cannot come from a dev-dependency.
# The dev-dependency above stays for plain `cargo test`.
[target.'cfg(target_os = "linux")'.dependencies]
glutin = { workspace = true, optional = true }

[features]
default = []
profiling = ["ii-stopwatch/enabled"]
# Exposes `renderer::test_support` to downstream crates' tests.
test-support = []
# Reads back femtovg's own glyph atlas, which the cache exists to keep empty,
# and the page order a frame's glyph batches went out in.
# Carries the headless GL harness because inspecting either needs a renderer.
atlas-inspect = ["femtovg/debug_inspector", "dep:glutin"]
# Builds the counting-allocator gate's harness into the library.
glyph-alloc-gate = ["dep:glutin"]

[[test]]
name = "glyph_cache_alloc_gate"
required-features = ["glyph-alloc-gate"]

[lints]
workspace = true
