[package]
name = "bmc"
version = "0.1.0"
edition = "2024"
authors = ["Braiins <braiins@braiins.com>"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
axum-extra = { workspace = true, features = [
    "cookie",
    "form",
    "multipart",
    "typed-header",
] }
bmc-display.workspace = true
bmc-grpc.workspace = true
bmc-platform.workspace = true
bmc-upgrade.workspace = true
chrono = { workspace = true }
chrono-tz.workspace = true
futures.workspace = true
http.workspace = true
hyper.workspace = true
index-bmc.workspace = true
index-common.workspace = true
mime_guess.workspace = true
minerctl-defs.workspace = true
reqwest.workspace = true
strum.workspace = true
strum_macros.workspace = true
sysinfo = { workspace = true, features = ["linux-tmpfs"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-stream.workspace = true
tokio-util = { workspace = true, features = ["full"] }
tonic.workspace = true
tonic-middleware.workspace = true
tonic-reflection.workspace = true
tonic-types.workspace = true
tonic-web.workspace = true
tower = { workspace = true, features = ["steer"] }
tower-cookies.workspace = true
tower-http = { workspace = true, features = [
    "compression-br",
    "compression-deflate",
    "compression-gzip",
    "compression-zstd",
    "normalize-path",
] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[lints]
workspace = true
