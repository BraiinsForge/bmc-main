[package]
name = "bmc"
version = "0.1.0"
edition = "2024"
authors = ["Braiins <braiins@braiins.com>"]

# Default-scene manifests embedded via include_str! from the sibling
# widgets-wasm tree; the nix source filter keeps only rust/toml/lock otherwise.
[package.metadata.nix]
include = [
    "../widgets-wasm/blockheight/manifest.json",
    "../widgets-wasm/clock/manifest.json",
    "../widgets-wasm/mining-clock/manifest.json",
    "../widgets-wasm/mining-info/manifest.json",
    "../widgets-wasm/weather/manifest.json",
]

[[bin]]
name = "bmc-migrate-config"
path = "src/bin/migrate_config.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
axum-extra = { workspace = true, features = [
    "cookie",
    "form",
    "multipart",
    "typed-header",
] }
bmc-audio.workspace = true
bmc-button.workspace = true
bmc-grpc = { workspace = true, features = ["server"] }
bmc-ipc.workspace = true
bmc-led = { workspace = true, features = ["driver"] }
bmc-log.workspace = true
bmc-nix.workspace = true
bmc-platform = { workspace = true, features = ["backlight"] }
bmc-scheduler.workspace = true
bmc-shared-ii-net.workspace = true
bmc-shared-time.workspace = true
bmc-shared-utils.workspace = true
bmc-support.workspace = true
bmc-upgrade = { workspace = true, features = ["disk-check"] }
bmc-widget.workspace = true
bmc-widget-manifest.workspace = true
bmc-widget-protocol.workspace = true
chrono = { workspace = true }
chrono-tz.workspace = true
futures.workspace = true
http.workspace = true
humantime-serde.workspace = true
hyper.workspace = true
indexmap.workspace = true
itertools.workspace = true
libc.workspace = true
mime_guess.workspace = true
prost-types.workspace = true
reqwest.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
tap.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-stream = { workspace = true, features = ["time"] }
tokio-util = { workspace = true, features = ["full"] }
tonic.workspace = true
tonic-middleware.workspace = true
tonic-reflection.workspace = true
tonic-types.workspace = true
tonic-web.workspace = true
tower = { workspace = true, features = ["steer"] }
tower-cookies.workspace = true
tower-http = { workspace = true, features = [
    "compression-br",
    "compression-deflate",
    "compression-gzip",
    "compression-zstd",
    "normalize-path",
] }
tracing.workspace = true
# Used by the `bmc-migrate-config` bin to surface the migration's
# per-widget `warn!` output; also by the widget-capture test harness.
tracing-subscriber = { workspace = true, features = ["env-filter"] }
uuid.workspace = true
walkdir.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
