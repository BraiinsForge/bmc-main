[project]
name = "bmc-tui"
version = "0.1.0"
description = "Shared rich-based TUI/DX tooling and the staged device-deploy engine"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "rich>=14",
    "tyro>=0.9",
]

[project.scripts]
deck = "bmc_tui.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100
cache-dir = "../.tmp/ruff_cache"

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
    "F", # pyflakes
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "I", # isort
    "N", # pep8-naming
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "A", # flake8-builtins
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific
    "PTH", # flake8-use-pathlib
    "PL", # pylint
    "PERF", # perflint
    "FURB", # refurb
    "PLR0917", # too many positional arguments (preview in ruff < 0.16)
]

[tool.ruff.lint.isort]
known-first-party = ["bmc_tui"]

[tool.ruff.lint.per-file-ignores]
# Tests routinely assert against literal expected values.
"tests/**" = ["PLR2004"]

[tool.ty.environment]
python-version = "3.11"
