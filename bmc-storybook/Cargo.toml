[package]
name = "bmc-storybook"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

# Toolbar icon SVGs loaded via include_bytes!; the nix source filter keeps only
# rust/toml/lock otherwise. The cross-crate assets referenced by the discovered
# `*.stories.rs` are declared by their owning crates (e.g. bmc-render).
[package.metadata.nix]
include = ["assets/**"]

[build-dependencies]
toml.workspace = true

[dependencies]
bmc-overlay-alarm = { path = "../system-overlays/bmc-overlay-alarm" }
bmc-overlay-device-info = { path = "../system-overlays/bmc-overlay-device-info" }
bmc-overlay-offline = { path = "../system-overlays/bmc-overlay-offline" }
bmc-overlay-settings-tray = { path = "../system-overlays/bmc-overlay-settings-tray" }
bmc-overlay-upgrade = { path = "../system-overlays/bmc-overlay-upgrade" }
bmc-render = { path = "../bmc-render" }
bmc-render-keyboard = { path = "../bmc-render/keyboard" }
bmc-render-skin = { path = "../bmc-render/skin" }
bmc-storybook-api = { path = "api" }
bmc-storybook-macros = { path = "storybook-macros" }
bmc-system-overlay = { path = "../system-overlays/bmc-system-overlay" }
bmc-wasm-sdk = { path = "../bmc-wasm-runtime/sdk" }
fleet-management = { path = "../widgets-wasm/fleet-management" }

anstyle-parse.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
femtovg.workspace = true
inventory.workspace = true
libloading.workspace = true
notify.workspace = true
resvg.workspace = true
sublime_fuzzy.workspace = true
taffy.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# Workaround for egui glow backend not setting NSColorSpace on macOS (egui#2712).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
raw-window-handle = "0.6"

[lints]
workspace = true
