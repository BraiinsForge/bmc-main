[package]
name = "bmc-overlay-settings-tray"
version = "0.1.0"
edition = "2024"
authors = ["Braiins Systems s.r.o."]
description = "Swipe-from-top quick-settings overlay (brightness + WiFi)"

# Wi-Fi icon SVGs are embedded via include_str!; the nix source filter keeps
# only rust/toml/lock otherwise.
[package.metadata.nix]
include = ["assets/**"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "bmc-overlay-settings-tray"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bmc-platform.workspace = true
bmc-render.workspace = true
bmc-render-macros = { path = "../../bmc-render/macros" }
bmc-svg-compiler.workspace = true
bmc-system-overlay.workspace = true
bmc-wasm-protocol.workspace = true
bmc-wasm-sdk = { path = "../../bmc-wasm-runtime/sdk" }
tracing.workspace = true

[lints]
workspace = true
