[package]
name = "bmc-overlay-settings-tray"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Braiins Systems s.r.o."]
description = "Swipe-from-top quick-settings overlay (brightness, volume, night mode, restart, WiFi)"

# Icon SVGs are compiled in via include_svg!; the nix source filter keeps
# only rust/toml/lock otherwise.
[package.metadata.nix]
include = ["assets/**", "../../assets/icons/close.svg"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "bmc-overlay-settings-tray"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bmc-net-observe.workspace = true
bmc-platform.workspace = true
bmc-render.workspace = true
bmc-render-macros = { path = "../../bmc-render/macros" }
bmc-system-overlay.workspace = true
bmc-wasm-protocol.workspace = true
bmc-wasm-sdk = { path = "../../bmc-wasm-runtime/sdk" }
tracing.workspace = true

[lints]
workspace = true
