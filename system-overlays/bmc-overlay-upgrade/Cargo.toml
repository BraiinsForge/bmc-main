[package]
name = "bmc-overlay-upgrade"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Braiins Systems s.r.o."]
description = "Firmware and package upgrade-progress overlays"

[package.metadata.nix]
include = ["assets/**"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "bmc-overlay-upgrade-firmware"
path = "src/bin/firmware.rs"

[[bin]]
name = "bmc-overlay-upgrade-packages"
path = "src/bin/packages.rs"

[dependencies]
anyhow.workspace = true
bmc-platform.workspace = true
bmc-render.workspace = true
bmc-system-overlay.workspace = true
bmc-wasm-protocol.workspace = true
tracing.workspace = true

[dev-dependencies]
bmc-render = { workspace = true, features = ["test-support"] }
bmc-system-overlay = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
