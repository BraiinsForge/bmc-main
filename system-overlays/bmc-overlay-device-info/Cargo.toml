[package]
name = "bmc-overlay-device-info"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Braiins Systems s.r.o."]
description = "Device-info overlay: first-boot setup, WiFi reconfiguration, and boot connect info"

# Icon SVGs are compiled in via include_svg!; the nix source filter keeps
# only rust/toml/lock otherwise.
[package.metadata.nix]
include = ["assets/*"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "bmc-overlay-device-info"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bmc-render.workspace = true
bmc-render-macros = { path = "../../bmc-render/macros" }
bmc-system-overlay.workspace = true
bmc-wasm-protocol.workspace = true
bmc-wasm-sdk = { path = "../../bmc-wasm-runtime/sdk" }
tracing.workspace = true

[lints]
workspace = true
