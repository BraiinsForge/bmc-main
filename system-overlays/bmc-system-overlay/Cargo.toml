libc.workspace = true
taffy.workspace = true
tracing.workspace = true
wayland-backend.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true
wayland-protocols-wlr = { workspace = true, features = ["client"] }

[lints]
workspace = true
