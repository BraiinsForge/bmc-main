[package]
name = "bmc-overlay-alarm"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Braiins Systems s.r.o."]
description = "Full-screen firing-alarm overlay (snooze + dismiss)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "bmc-overlay-alarm"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bmc-render.workspace = true
bmc-system-overlay.workspace = true
tracing.workspace = true

[dev-dependencies]
bmc-render = { workspace = true, features = ["test-support"] }
bmc-system-overlay = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
