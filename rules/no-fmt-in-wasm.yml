id: no-fmt-in-wasm
language: rust
severity: error
message: |
  Allocating fmt macro in widget-side code. These pull `core::fmt::Arguments`
  + per-type `Display`/`Debug` codegen into every widget binary, which costs
  ~tens of KB compressed. Use `ufmt::uwrite!` / `ufmt::uwriteln!` from
  the `ufmt` crate (already in `bmc-wasm-sdk`) for widget-side formatting,
  or write into a pre-sized buffer with `write!`.
files:
  - "bmc-wasm-runtime/sdk/src/**/*.rs"
  - "bmc-wasm-runtime/protocol/src/**/*.rs"
  - "widgets-wasm-examples/*/src/**/*.rs"
  - "widgets-wasm/src/**/*.rs"
  - "widgets-wasm/**/src/**/*.rs"
rule:
  any:
    - pattern: format!($$$)
    - pattern: println!($$$)
    - pattern: print!($$$)
    - pattern: eprintln!($$$)
    - pattern: eprint!($$$)
    - pattern: dbg!($$$)
