[package]
name = "deck-localization-v1"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Braiins Forge s.r.o."]
description = "Vendored deck_localization_v1 Wayland protocol (the device language for overlays)"

# Wayland protocol XML read by wayland_scanner proc macros; the nix source
# filter keeps only rust/toml/lock unless a crate opts extra files in here.
[package.metadata.nix]
include = ["protocol/deck-localization-v1.xml"]

[dependencies]
wayland-backend.workspace = true
wayland-client.workspace = true
wayland-scanner.workspace = true
wayland-server.workspace = true

[lints]
workspace = true
