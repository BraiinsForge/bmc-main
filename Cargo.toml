# `default-formats` minus
#  - avif (pulls the heavy ravif/rav1e stack)
#  - exr (large, and re-enables rayon through its `exr?/rayon`)
#  - tga (no leading magic bytes, so `guess_format` can never select it)
#  - dds (a DirectX texture container no URL serves; decode-only in `image`,
#    so the round-trip test could never cover it)
#  - ico (a Windows icon container rather than an image format,
#    same call as dds; `image` also decodes it only from an RGBA PNG payload)
