[workspace]
resolver = "3"
exclude = [
    # The gallery pins its own framework and lockfile so its egui
    # version stays clear of ours.
    "bmc-gallery",
    "tooling",
    "widgets-wasm-examples",
]
members = [
    "bmc",
    "bmc-audio",
    "bmc-button",
    "bmc-field-schema",
    "bmc-gpio",
    "bmc-gpu-render-lock",
    "bmc-grpc",
    "bmc-ipc",
    "bmc-kobject",
    "bmc-led",
    "bmc-log",
    "bmc-mock",
    "bmc-net/*",
    "bmc-netsim",
    "bmc-nix",
    "bmc-openwrt",
    "bmc-platform",
    "bmc-render",
    "bmc-render/keyboard",
    "bmc-render/macros",
    "bmc-render/skin",
    "bmc-scheduler",
    "bmc-shared/*",
    "bmc-support",
    "bmc-upgrade",
    "bmc-virt/console",
    "bmc-virt/ipc",
    "bmc-virt/leds",
    "bmc-virt/relay",
    "bmc-wasm-assets",
    "bmc-wasm-assets/tests/fixtures/asset-dep",
    "bmc-wasm-assets/tests/fixtures/linker-widget",
    "bmc-wasm-assets/tests/fixtures/macro-widget",
    "bmc-wasm-assets/tests/fixtures/unused-dep",
    "bmc-wasm-host",
    "bmc-wasm-runtime",
    "bmc-wasm-runtime/protocol",
    "bmc-wasm-runtime/sdk",
    "bmc-wasm-runtime/sdk-macros",
    "bmc-wasm-runtime/svg-compiler",
    "bmc-wasm-thin",
    "bmc-wasm-thin-protocol",
    "bmc-widget",
    "bmc-widget-codegen",
    "bmc-widget-manifest",
    "bmc-widget-manifest-tests",
    "bmc-widget-protocol",
    "deck-alarm-v1",
    "deck-screen-edge-v1",
    "deck-settings-v1",
    "deck-upgrade-v1",
    "system-overlays/bmc-overlay-alarm",
    "system-overlays/bmc-overlay-device-info",
    "system-overlays/bmc-overlay-offline",
    "system-overlays/bmc-overlay-settings-tray",
    "system-overlays/bmc-overlay-upgrade",
    "system-overlays/bmc-system-overlay",
    "system-overlays/layer-shell-test-client",
    "widgets/*",
]

[workspace.metadata.nix]
# `clippy.toml` configures `disallowed_methods`; without it in the sandbox
# the lint has nothing to forbid
# and the CI gate passes on code the local one rejects.
include = [
    "clippy.toml",
    "tooling/**",
]

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"

[profile.dev]
opt-level = 3
strip = true

[profile.profiling]
inherits = "release"
debug = true
strip = false

# Full debug info for time-travel debugging with rr.
# Build: cargo build --profile rr
# Or via nix: BMC_PROFILE=x86_64-rr make -C bmc-virt run
[profile.rr]
inherits = "dev"
debug = true
strip = false

# special profile used in CI, optimized for fast compilation and efficient caching
[profile.fast]
inherits = "dev"
opt-level = 0
debug = false
strip = true
incremental = false
codegen-units = 512

# Spelled out, though the sub-tables below would imply it: `check-workspace-lints`
# looks the table up by that exact path and cannot see one that only exists implicitly.
[workspace.lints]

[workspace.lints.rust]
# deny
unused_must_use = "deny"
# warn
explicit_outlives_requirements = "warn"
future_incompatible = { level = "warn", priority = -1 }
macro_use_extern_crate = "warn"
missing_debug_implementations = "warn"
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
trivial_numeric_casts = "warn"
# allow
deprecated = "allow"
unused_crate_dependencies = "allow"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# lints from the clippy::pedantic group that are explicitly allowed
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
needless_continue = "allow"
new_without_default = "allow"
similar_names = "allow"
unreadable_literal = "allow"
# additional useful lints not coveded by clippy::pedantic
allow_attributes = "warn"
# Configured in the repo-root `clippy.toml`; allow-by-default without this.
disallowed_methods = "warn"
get_unwrap = "warn"
implicit_clone = "warn"
integer_division = "warn"
lossy_float_literal = "warn"
modulo_arithmetic = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
string_add = "warn"
string_slice = "warn"
unneeded_field_pattern = "warn"
unseparated_literal_suffix = "warn"
unwrap_used = "warn"
wildcard_enum_match_arm = "warn"

