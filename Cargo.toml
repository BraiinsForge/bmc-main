[workspace]
resolver = "3"
exclude = [
    "bmc-wasm-runtime/examples",
]
members = [
    "bmc",
    "bmc-audio",
    "bmc-button",
    "bmc-gpio",
    "bmc-grpc",
    "bmc-ipc",
    "bmc-kobject",
    "bmc-led",
    "bmc-mock",
    "bmc-nix",
    "bmc-nix-init",
    "bmc-nix-init-mock",
    "bmc-nix-init-openwrt",
    "bmc-openwrt",
    "bmc-platform",
    "bmc-render",
    "bmc-render/macros",
    "bmc-render/skin",
    "bmc-scheduler",
    "bmc-shared/*",
    "bmc-storybook",
    "bmc-storybook/api",
    "bmc-storybook/stories",
    "bmc-storybook/storybook-macros",
    "bmc-support",
    "bmc-upgrade",
    "bmc-virt/console",
    "bmc-virt/ipc",
    "bmc-virt/leds",
    "bmc-virt/relay",
    "bmc-wasm-runtime",
    "bmc-wasm-runtime/icon-compiler",
    "bmc-wasm-runtime/protocol",
    "bmc-wasm-runtime/sdk",
    "bmc-wasm-runtime/sdk-macros",
    "bmc-widget",
    "bmc-widget-protocol",
    "widgets/*",
]

[profile.release]
strip = true

[profile.dev]
opt-level = 3
strip = true

[profile.lto]
inherits = "release"
lto = true

[profile.profiling]
inherits = "release"
debug = true
strip = false

# Full debug info for time-travel debugging with rr.
# Build: cargo build --profile rr
# Or via nix: BMC_PROFILE=x86_64-rr make -C bmc-virt run
[profile.rr]
inherits = "dev"
debug = true
strip = false

# special profile used in CI, optimized for fast compilation and efficient caching
[profile.fast]
inherits = "dev"
opt-level = 0
debug = false
strip = true
incremental = false
codegen-units = 512

[workspace.lints.rust]
# deny
unused_must_use = "deny"
# warn
explicit_outlives_requirements = "warn"
future_incompatible = { level = "warn", priority = -1 }
macro_use_extern_crate = "warn"
missing_debug_implementations = "warn"
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
trivial_numeric_casts = "warn"
# allow
deprecated = "allow"
unused_crate_dependencies = "allow"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# lints from the clippy::pedantic group that are explicitly allowed
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
needless_continue = "allow"
new_without_default = "allow"
similar_names = "allow"
unreadable_literal = "allow"
# additional useful lints not coveded by clippy::pedantic
allow_attributes = "warn"
get_unwrap = "warn"
implicit_clone = "warn"
integer_division = "warn"
lossy_float_literal = "warn"
modulo_arithmetic = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
string_add = "warn"
string_slice = "warn"
unneeded_field_pattern = "warn"
unseparated_literal_suffix = "warn"
wildcard_enum_match_arm = "warn"

