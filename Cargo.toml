[workspace]
resolver = "3"
members = [
    "bmc",
    "bmc-display",
    "bmc-grpc",
    "bmc-mock",
    "bmc-mock-display",
    "bmc-openwrt",
    "bmc-platform",
    "bmc-upgrade",
]

[profile.release]
strip = true

[profile.dev]
opt-level = 3
strip = true

[profile.lto]
inherits = "release"
lto = true

# special profile used in CI, optimized for fast compilation and efficient caching
[profile.fast]
inherits = "dev"
opt-level = 0
debug = false
strip = true
incremental = false
codegen-units = 512

[workspace.lints.rust]
# deny
unused_must_use = "deny"
# warn
explicit_outlives_requirements = "warn"
future_incompatible = { level = "warn", priority = -1 }
macro_use_extern_crate = "warn"
missing_debug_implementations = "warn"
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
trivial_numeric_casts = "warn"
unused_crate_dependencies = "warn"
# allow
deprecated = "allow"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# lints from the clippy::pedantic group that are explicitly allowed
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
new_without_default = "allow"
similar_names = "allow"
unreadable_literal = "allow"
# additional useful lints not coveded by clippy::pedantic
allow_attributes = "warn"
get_unwrap = "warn"
integer_division = "warn"
lossy_float_literal = "warn"
modulo_arithmetic = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
str_to_string = "warn"
string_add = "warn"
string_slice = "warn"
string_to_string = "warn"
unneeded_field_pattern = "warn"
unseparated_literal_suffix = "warn"
wildcard_enum_match_arm = "warn"

[workspace.dependencies]
anyhow = "1.0.98"
async-trait = "0.1.88"
axum = "0.8.3"
axum-extra = "0.10.1"
bmc = { path = "bmc" }
bmc-display = { path = "bmc-display" }
bmc-grpc = { path = "bmc-grpc" }
bmc-mock-display = { path = "bmc-mock-display" }
bmc-platform = { path = "bmc-platform" }
bmc-upgrade = { path = "bmc-upgrade" }
bytes = { version = "1.6.0", default-features = false }
chrono = "0.4.40"
clap = { version = "4.5.36", features = ["derive", "std"] }
data-encoding = "2.6.0"
dirs = "6.0.0"
flume = { version = "0.11.1", default-features = false }
fs-err = "3.1.0"
futures = "0.3.31"
glob = "0.3.2"
hex = "0.4.3"
http = "1.3.1"
hyper = "1.6.0"
index-bmc = { git = "ssh://git@gitlab.ii.zone/tooling/tooling.git", rev = "b325c4bbdc6170d1be03dcef334b7eec064ec259" }
index-common = { git = "ssh://git@gitlab.ii.zone/tooling/tooling.git", rev = "b325c4bbdc6170d1be03dcef334b7eec064ec259" }
memmap2 = "0.9.4"
mime_guess = "2.0.5"
minerctl-defs = { git = "ssh://git@gitlab.ii.zone/tooling/tooling.git", rev = "b325c4bbdc6170d1be03dcef334b7eec064ec259" }
prost = "0.13"
rand = { version = "0.9.0", default-features = false }
ring = { version = "0.17.8", default-features = false }
serde = "1.0.219"
serde_json = "1.0.140"
sha2 = "0.10.9"
slint = "1.10"
slint-build = "1.10"
strum = { version = "0.27", default-features = false }
sysinfo = "0.35.0"
thiserror = "2.0.12"
time = { version = "0.3.41", default-features = false }
tokio = { version = "1.44.2", features = ["full"] }
tokio-util = "0.7"
tonic = "0.13.0"
tonic-build = "0.13.0"
tonic-middleware = "0.3.0"
tonic-reflection = "0.13.0"
tonic-web = "0.13.0"
tower = { version = "0.5.2", default-features = false }
tower-http = "0.6.2"
tracing = { version = "0.1.41", default-features = false }
tracing-subscriber = "0.3.19"
