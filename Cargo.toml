[workspace]
resolver = "3"
members = ["bmc", "bmc-core", "bmc-grpc", "bmc-mock", "bmc-openwrt"]

[profile.release]
strip = true

[profile.dev]
opt-level = 0
strip = true

[profile.lto]
inherits = "release"
lto = true

# special profile used in CI, optimized for fast compilation and efficient caching
[profile.fast]
inherits = "dev"
opt-level = 0
debug = false
strip = true
incremental = false
codegen-units = 512

[workspace.lints.rust]
# deny
unused_must_use = "deny"
# warn
explicit_outlives_requirements = "warn"
future_incompatible = { level = "warn", priority = -1 }
macro_use_extern_crate = "warn"
missing_debug_implementations = "warn"
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
trivial_numeric_casts = "warn"
unused_crate_dependencies = "warn"
# allow
deprecated = "allow"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# lints from the clippy::pedantic group that are explicitly allowed
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
new_without_default = "allow"
similar_names = "allow"
unreadable_literal = "allow"
# additional useful lints not coveded by clippy::pedantic
allow_attributes = "warn"
get_unwrap = "warn"
integer_division = "warn"
lossy_float_literal = "warn"
modulo_arithmetic = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
str_to_string = "warn"
string_add = "warn"
string_slice = "warn"
string_to_string = "warn"
unneeded_field_pattern = "warn"
unseparated_literal_suffix = "warn"
wildcard_enum_match_arm = "warn"

[workspace.dependencies]
anyhow = "1.0.97"
axum = "0.8.3"
chrono = "0.4.40"
clap = { version = "4.5.35", features = ["derive", "std"] }
dirs = "6.0.0"
fs-err = "3.1.0"
glob = "0.3.2"
hex = "0.4.3"
hyper = "1.6.0"
mime_guess = "2.0.5"
prost = "0.13"
prost-types = "0.13"
sha2 = "0.10.8"
tokio = { version = "1.44.2", features = ["full"] }
tokio-util = "0.7"
tonic = "0.13.0"
tonic-build = "0.13.0"
tonic-reflection = "0.13.0"
tonic-web = "0.13.0"
tower = { version = "0.5.2", default-features = false }
tower-http = "0.6.2"
tracing = { version = "0.1.41", default-features = false }
tracing-subscriber = "0.3.19"
