base64 = "0.22.1"
bincode = "2.0.0" # NOTE: check https://docs.rs/bincode/latest/bincode/serde/index.html#known-issues before enabling `serde` feature
bmc = { path = "bmc" }
bmc-display = { path = "bmc-display" }
bmc-grpc = { path = "bmc-grpc" }
bmc-mock-display = { path = "bmc-mock-display" }
bmc-platform = { path = "bmc-platform" }
bmc-scheduler = { path = "bmc-scheduler" }
bmc-shared-time = { path = "bmc-shared/time" }
bmc-upgrade = { path = "bmc-upgrade" }
bstr = "1.11.3"
bytes = { version = "1.6.0", default-features = false }
bytesize = { version = "2.0.1", features = ["serde"] }
chrono = { version = "0.4.40", features = ["serde"] }
chrono-tz = { version = "0.10.3", default-features = false }
clap = { version = "4.5.37", features = ["derive", "std"] }
croner = "2.1.0"
data-encoding = "2.6.0"
dialoguer = "0.11.0"
dirs = "6.0.0"
drm = "0.14.1"
