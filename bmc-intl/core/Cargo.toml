[package]
name = "bmc-intl"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "The message runtime every Rust surface words its copy through"

[package.metadata.nix]
include = ["lang/*"]

[lints]
workspace = true

[dependencies]
bmc-intl-message.workspace = true
bmc-shared-utils.workspace = true
formatjs_icu_messageformat = { workspace = true, features = ["compiled_data"] }
formatjs_icu_messageformat_parser.workspace = true
formatjs_intl.workspace = true
icu_locale_core.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[build-dependencies]
formatjs_icu_messageformat.workspace = true
formatjs_icu_messageformat_parser.workspace = true
serde_json.workspace = true
