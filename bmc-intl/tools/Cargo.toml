[package]
name = "bmc-intl-tools"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "The `intl` translation pipeline: extracts, verifies and lists translator copy"

[[bin]]
name = "intl"
path = "src/main.rs"

[package.metadata.nix]
include = ["../../frontend/message-id.json"]

[lints]
workspace = true

[dependencies]
clap.workspace = true
clap-cargo.workspace = true
console.workspace = true
formatjs_icu_messageformat.workspace = true
formatjs_icu_messageformat_parser.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tabled.workspace = true

[dev-dependencies]
bmc-intl-message.workspace = true
prettyplease.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
tempfile.workspace = true
