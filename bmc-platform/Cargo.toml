[package]
name = "bmc-platform"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Braiins <braiins@braiins.com>"]

# `mkWorkspaceConfig` omits root includes from per-crate sources,
# so keep the complete nested tooling workspace in this dependency closure.
[package.metadata.nix]
include = ["../tooling/**"]

[features]
backlight = ["dep:anyhow", "dep:tracing"]
linux-input = ["dep:tracing"]

[dependencies]
anyhow = { workspace = true, optional = true }
index-bmc.workspace = true
packed_struct.workspace = true
strum = { workspace = true, features = ["derive"], default-features = true }
thiserror.workspace = true
tracing = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
