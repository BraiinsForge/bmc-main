[project]
name = "bmc-virt"
version = "0.1.0"
description = "BMC virtual machine event daemon, test harness, and CLI"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "rich>=14",
    "matplotlib>=3.9",
    "bmc-tui",
]

[project.scripts]
bmc-virt = "bmc_virt.cli:main"

[tool.uv.sources]
bmc-tui = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100
cache-dir = "../../.tmp/ruff_cache"

[tool.ruff.lint]
select = [
    "F", # pyflakes
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "I", # isort
    "N", # pep8-naming
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "A", # flake8-builtins
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific
    "PTH", # flake8-use-pathlib
    "PL", # pylint
    "PERF", # perflint
    "FURB", # refurb
]

[tool.ruff.lint.isort]
known-first-party = ["bmc_tui", "bmc_virt"]

[tool.ruff.lint.per-file-ignores]
# Tests routinely assert against literal expected values.
"tests/**" = ["PLR2004"]

[tool.ty.environment]
python-version = "3.11"
