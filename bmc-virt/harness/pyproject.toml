[project]
name = "bmc-virt"
version = "0.1.0"
description = "BMC virtual machine event daemon, test harness, and CLI"
requires-python = ">=3.11"
dependencies = [
    "rich>=14",
    "matplotlib>=3.9",
]

[project.scripts]
bmc-virt = "bmc_virt.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "F", # pyflakes
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "I", # isort
    "N", # pep8-naming
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "A", # flake8-builtins
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific
    "PTH", # flake8-use-pathlib
    "PL", # pylint
    "PERF", # perflint
    "FURB", # refurb
]

[tool.ruff.lint.isort]
known-first-party = ["bmc_virt"]

[tool.ty.environment]
python-version = "3.11"
