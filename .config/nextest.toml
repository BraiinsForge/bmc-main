# Nextest settings for the root workspace.

[profile.default]
# Show output from tests that passed, not just from ones that failed.
#
# Most tests print nothing on success, so what surfaces is a skip.
# Several integration tests need a headless EGL stack; where it is missing
# they return early, which passes and otherwise looks just like a run.
#
# The Nix `ci` profile sets BMC_REQUIRE_HEADLESS_EGL to make that fatal where
# Mesa is supplied. Here it is only made legible.
success-output = "final"
