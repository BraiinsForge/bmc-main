# A message with arguments is inline: `format_message!` at the call site,
# `description` and `values` beside the English.
# A hoisted `message_descriptor!` with an argument or a tag separates the pattern from its values,
# which the compile-time placeholder check exists to keep together.
# An argument-free message may be a constant, worded with `format_lazy`.
#
# Ignored: the lazy-message crate, which defines the macro.

id: no-message-descriptor
language: rust
severity: error

message: "`message_descriptor!` hoists a message with arguments away from its values — call `format_message!` where the text is used."

files:
  - "**/*.rs"
ignores:
  - "bmc-grpc/src/gen/**"
  - "bmc-intl/message/**"
  # The `intl` extractor's tests feed it copy in the shapes it must find.
  - "bmc-intl/tools/**"

rule:
  all:
    - any:
        - pattern: message_descriptor!($$$)
        - pattern: $P::message_descriptor!($$$)
    # The literal after `default_message:`, as a token, so escapes, continuations
    # and raw strings are the parser's to read rather than a regex's.
    # An ICU argument opens with `{`, a tag with `<`. Errs toward refusing:
    # a literal `<`, a quoted brace or a `\u{…}` escape counts too.
    - has:
        stopBy: end
        any:
          - kind: string_literal
          - kind: raw_string_literal
        regex: "[{<]"
        follows:
          kind: identifier
          regex: "^default_message$"
          stopBy:
            any:
              - kind: string_literal
              - kind: raw_string_literal
