# ast-grep configuration, for rules cargo-deny and clippy cannot express
# (crate-level bans do not catch macro usage; nothing else reads Nix).
#
# The scan walks the working tree, so every rule must carry its own
# `files:` globs — one that omits them is matched against the whole repository.

ruleDirs:
  - rules

# `.ts` files parse under the `tsx` grammar, so one web rule covers both.
# Nothing in `frontend/src` uses the one construct that grammar rejects, the `<T>expr` cast.
languageGlobs:
  tsx:
    - "*.ts"
