# Its own workspace root, so it resolves the same wherever the checkout sits —
# the root manifest's `exclude` only covers this crate at its usual path.
[workspace]

# `build.rs` reads the scene glob from `gallery.toml`, which Cargo metadata
# does not discover as a source input for the Nix filter.
[workspace.metadata.nix]
include = ["gallery.toml"]

# Mirrors the root manifest's set, verbatim. Being its own workspace root,
# this crate has nothing to inherit — but the scenes are the same code held to
# the same bar, so the set is restated rather than dropped. Keep the two in step.
[workspace.lints.rust]
# deny
unused_must_use = "deny"
# warn
explicit_outlives_requirements = "warn"
future_incompatible = { level = "warn", priority = -1 }
macro_use_extern_crate = "warn"
missing_debug_implementations = "warn"
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
trivial_numeric_casts = "warn"
# allow
deprecated = "allow"
# From `rust_2018_idioms`, and the one place this set departs from the root's.
# A scene is `fn(&mut SceneCtx, &mut Ui)` because the `#[scene]` macro says so,
# and rs-gallery's own scaffold writes it elided; spelling out `SceneCtx<'_>`
# in eighty-odd identical signatures drifts from upstream and says nothing.
elided_lifetimes_in_paths = "allow"
unused_crate_dependencies = "allow"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# lints from the clippy::pedantic group that are explicitly allowed
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
needless_continue = "allow"
new_without_default = "allow"
similar_names = "allow"
unreadable_literal = "allow"
# additional useful lints not coveded by clippy::pedantic
allow_attributes = "warn"
# Configured in the repo-root `clippy.toml`; allow-by-default without this.
disallowed_methods = "warn"
get_unwrap = "warn"
implicit_clone = "warn"
integer_division = "warn"
lossy_float_literal = "warn"
modulo_arithmetic = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
string_add = "warn"
string_slice = "warn"
unneeded_field_pattern = "warn"
unseparated_literal_suffix = "warn"
unwrap_used = "warn"
wildcard_enum_match_arm = "warn"

[package]
# Distinct from the `gallery` framework crate it depends on
# (and from the bin/dylib named `gallery`), so the scenes dylib
# doesn't collide with the framework at link time.
name = "bmc-gallery"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "The Deck widget gallery — an instance of the rs-gallery framework."

[lints]
workspace = true

[lib]
path = "lib.rs"
crate-type = ["dylib"]

[[bin]]
name = "gallery"
path = "main.rs"

[dependencies]
# Pinned by rev rather than tracking a branch: the lockfile beside this file is
# what CI and a fresh clone resolve through, and a scene API moves under us otherwise.
gallery = { git = "https://github.com/kubijo/rs-gallery.git", rev = "8fa0a90a4dfad1c999db352233ff57e60e3f7d7e" }

bmc-overlay-alarm = { path = "../system-overlays/bmc-overlay-alarm" }
bmc-overlay-device-info = { path = "../system-overlays/bmc-overlay-device-info" }
bmc-overlay-offline = { path = "../system-overlays/bmc-overlay-offline" }
bmc-overlay-settings-tray = { path = "../system-overlays/bmc-overlay-settings-tray" }
bmc-overlay-upgrade = { path = "../system-overlays/bmc-overlay-upgrade" }
bmc-render = { path = "../bmc-render" }
bmc-render-keyboard = { path = "../bmc-render/keyboard" }
bmc-render-skin = { path = "../bmc-render/skin" }
# The upgrade scene's view types, which the overlay crate takes but does not re-export.
bmc-system-overlay = { path = "../system-overlays/bmc-system-overlay" }
bmc-wasm-sdk = { path = "../bmc-wasm-runtime/sdk" }
braiins-pool = { path = "../widgets-wasm/braiins-pool" }
fleet-management = { path = "../widgets-wasm/fleet-management" }
formula-1 = { path = "../widgets-wasm/formula-1" }

# Keep in step with the root manifest; see it for why the fork exists.
femtovg = { git = "https://github.com/BraiinsForge/femtovg.git", rev = "45047b19d18b0b444aca195a3fd13b2fb83bc525" }
# Matches the workspace pin; the default features carry the output backends
# the sink opens, which bmc-render-keyboard's own dependency does not need.
rodio = "0.20"
taffy = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# The batch-order test needs `atlas-inspect` for the page readback
# and for the headless GL context that gets it a renderer at all.
# A dev-dependency because the launcher and the scenes dylib resolve without it.
bmc-render = { path = "../bmc-render", features = ["atlas-inspect"] }

[build-dependencies]
gallery-build = { git = "https://github.com/kubijo/rs-gallery.git", rev = "8fa0a90a4dfad1c999db352233ff57e60e3f7d7e" }

# Reached only from scenes, which live in the crates they exercise and arrive
# through the glob — nothing under this manifest's own directory names them.
[package.metadata.cargo-machete]
ignored = [
    "bmc-overlay-alarm",
    "bmc-overlay-device-info",
    "bmc-overlay-offline",
    "bmc-overlay-settings-tray",
    "bmc-overlay-upgrade",
    "bmc-system-overlay",
    "braiins-pool",
    "fleet-management",
    "formula-1",
]

# rustc 1.97.1 aborts (SIGABRT, no diagnostic) generating code for this dylib
# incrementally; the same build with `CARGO_INCREMENTAL=0` succeeds. Drop this
# once a toolchain builds the scenes with it back on.
[profile.dev]
incremental = false

# Scenes stay debuggable at opt 0, but bmc-render/femtovg
# at opt 0 would crawl. Optimize dependencies only.
[profile.dev.package."*"]
opt-level = 3
