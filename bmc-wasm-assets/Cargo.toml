[package]
name = "bmc-wasm-assets"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

# Cross-crate payloads compiled by the linker and macro fixtures; the Nix
# source filter otherwise keeps only Rust, TOML, and lock files.
[package.metadata.nix]
include = [
    "../bmc-render/assets/panel.9.png",
    "../bmc-render/assets/skins/gallery_slider/**",
    "../widgets-wasm/image/assets/renew.svg",
    "../widgets-wasm/iss-position/src/render/texture.jpg",
    "../widgets-wasm/spacex-launch/assets/*.png",
    "../widgets-wasm-examples/mesh-demo/assets/suzanne.glb",
    "../widgets-wasm-examples/metronome/assets/sounds/Perc_MetronomeQuartz_lo.wav",
]

[features]
default = ["cli", "extractor"]
cli = ["dep:clap", "extractor"]
extractor = ["dep:anyhow", "dep:tempfile", "dep:walkdir", "dep:wasmparser"]

[dependencies]
anyhow = { workspace = true, optional = true }
bmc-wasm-protocol.workspace = true
clap = { workspace = true, optional = true }
sha2.workspace = true
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
walkdir = { workspace = true, optional = true }
wasmparser = { workspace = true, optional = true }

[[bin]]
name = "bmc-wasm-assets"
required-features = ["cli"]

[dev-dependencies]
assert_matches.workspace = true

[lints]
workspace = true
